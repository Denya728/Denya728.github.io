<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DENYA · Administración</title>
<link rel="stylesheet" href="admin-v91.css?v=97">
</head>
<body>
<div id="root"><div class="a91-login"><div class="a91-brand">✦ DENYA <span>Administración</span></div><p class="a91-muted">Cargando administración…</p></div></div>
<script>
(function(){
  const root=document.getElementById('root');
  function fail(msg){
    root.innerHTML='<div class="a91-login"><div class="a91-brand">✦ DENYA <span>Administración</span></div><h1>No pudimos cargar Administración</h1><p class="a91-muted">'+msg+'</p><button class="a91-btn a91-primary" onclick="location.reload()">Reintentar</button></div>';
  }
  window.addEventListener('unhandledrejection',function(e){
    const m=e.reason&&e.reason.message?e.reason.message:String(e.reason||'Error inesperado');
    fail('Error al iniciar Administración: '+m);
  });
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload=function(){
    if(!window.supabase)return fail('El cliente de Supabase no está disponible.');
    const a=document.createElement('script');
    a.src='admin-v91.js?v=97';
    a.onerror=function(){fail('No se pudo cargar el módulo de Administración.');};
    document.body.appendChild(a);
  };
  s.onerror=function(){fail('No se pudo cargar el cliente de Supabase. Revisa la conexión y vuelve a intentar.');};
  document.body.appendChild(s);
  setTimeout(function(){
    if(root.textContent.includes('Cargando administración')) fail('La Administración tardó demasiado en iniciar. Recarga la página.');
  },10000);
})();
</script>
</body>
</html>
