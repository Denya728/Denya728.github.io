<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DENYA · Administración</title>
<link rel="stylesheet" href="admin-v91.css?v=98">
</head>
<body>
<div id="root"><div class="a91-login"><div class="a91-brand">✦ DENYA <span>Administración</span></div><p class="a91-muted">Cargando administración…</p></div></div>
<script>
(function(){
  window.__adminSupabaseLoadFailed=false;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onerror=function(){
    window.__adminSupabaseLoadFailed=true;
    const root=document.getElementById('root');
    root.innerHTML='<div class="a91-login"><div class="a91-brand">✦ DENYA <span>Administración</span></div><h1>No pudimos cargar Administración</h1><p class="a91-muted">No se pudo cargar el cliente de Supabase.</p><button class="a91-btn a91-primary" onclick="location.reload()">Reintentar</button></div>';
  };
  document.head.appendChild(s);
})();
</script>
<script>
setTimeout(function(){
  if(document.getElementById('root')?.textContent.includes('Cargando administración')){
    document.getElementById('root').innerHTML='<div class="a91-login"><div class="a91-brand">✦ DENYA <span>Administración</span></div><h1>No pudimos cargar Administración</h1><p class="a91-muted">El módulo de Administración no terminó de iniciar.</p><button class="a91-btn a91-primary" onclick="location.reload()">Reintentar</button></div>';
  }
},15000);
</script>
<script src="admin-v91.js?v=98" onerror="document.getElementById('root').innerHTML='<div class=&quot;a91-login&quot;><h1>No pudimos cargar Administración</h1><p class=&quot;a91-muted&quot;>No se pudo cargar el módulo de Administración.</p><button class=&quot;a91-btn a91-primary&quot; onclick=&quot;location.reload()&quot;>Reintentar</button></div>'"></script>
</body>
</html>
