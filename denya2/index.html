<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENYA 2.0 Demo</title><link rel="stylesheet" href="style.css">
<style>
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:grid;gap:6px;font-size:13px;font-weight:700}.f input,.f select,.f textarea{border:1px solid #ded5ce;border-radius:12px;padding:11px;font:inherit;background:#fff}.f textarea{min-height:105px;resize:vertical}.full{width:100%}.qgrid{display:grid;grid-template-columns:1.35fr .75fr;gap:18px}.qbox{background:#fff;border:1px solid #ebe4dd;border-radius:18px;padding:20px}.qsum{background:#2f261f;color:#fff;border-radius:18px;padding:20px;align-self:start;position:sticky;top:100px}.qsum .r{display:flex;justify-content:space-between;padding:8px 0}.qsum .total{border-top:1px solid #67584d;margin-top:10px;padding-top:14px;font-size:22px}.cfg{padding:14px 0;border-bottom:1px solid #eee7e1}.cfg h4{margin:0 0 8px}.modalx{position:fixed;inset:0;background:rgba(20,16,13,.55);display:grid;place-items:center;padding:18px;z-index:60}.modalcard{width:min(900px,97vw);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.hint{background:#f6efe8;border:1px solid #eadfd6;border-radius:14px;padding:12px;margin:12px 0;color:#6e5f55}.empty{border:2px dashed #ddd1c7;border-radius:16px;padding:24px;text-align:center;color:#81756c}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{border:1px solid #d8cdc4;background:#fff;border-radius:999px;padding:9px 12px;cursor:pointer}.choice button.active{background:#2f261f;color:#fff}.small{font-size:12px;color:#81756c}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1ebe5;font-size:12px}.danger{color:#a13b2b}.config-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.config-summary div{background:#faf7f4;border:1px solid #eee5dd;padding:10px;border-radius:12px;font-size:12px}@media(max-width:900px){.form2,.qgrid,.config-summary{grid-template-columns:1fr}.qsum{position:static}}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand">✦ DENYA</div><div class="biz">SweetLab</div><nav>
<button class="active" data-view="home">Inicio</button><button data-view="quotes">Cotizador</button><button data-view="recipes">Recetas</button><button data-view="production">Producción</button><button data-view="inventory">Inventario</button><button data-view="finance">Finanzas</button><button data-view="plan">Mi plan</button>
</nav><div class="foot">Demo cliente · DENYA 2.0</div></aside>
<main><header><div><small>SweetLab</small><h2 id="title">Inicio</h2></div><div class="avatar">S</div></header><section id="content"></section></main>
</div>
<script>
const KEY='denya2-config-v3';
const seed={plan:'Negocio',products:[{id:'cake',name:'Pastel personalizado',margin:55,configured:false,variantLabel:'Tipo / presentación',variants:[],sizeLabel:'Tamaño / rendimiento',sizes:[],baseLabel:'Sabor / receta base',bases:[],fillingLabel:'Relleno',fillings:[],coverLabel:'Cobertura',covers:[],extras:[],showFillings:true,showCovers:true}]};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){state=seed}
const content=document.getElementById('content'),titleEl=document.getElementById('title');
const mx=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(n)||0);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(m){let t=document.getElementById('toastx');if(!t){t=document.createElement('div');t.id='toastx';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function f(label,id,type='text',value=''){return `<label class="f">${label}<input id="${id}" type="${type}" value="${String(value??'').replaceAll('"','&quot;')}"></label>`}
function ta(label,id,value='',help=''){return `<label class="f">${label}<textarea id="${id}">${value||''}</textarea>${help?`<span class="small">${help}</span>`:''}</label>`}
function parseLines(text,mode='cost'){return text.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const [name,val]=line.split('|').map(x=>x.trim());return {name:name||'Opción',value:Number(val)||0}})}
function lines(arr){return (arr||[]).map(x=>`${x.name}|${x.value}`).join('\n')}
function modal(title,body,onSave,label='Guardar'){const w=document.createElement('div');w.className='modalx';w.innerHTML=`<div class="modalcard"><div class="rowhead"><h2>${title}</h2><button class="icon-btn" id="xx">×</button></div>${body}<div class="modal-actions"><button class="secondary" id="cc">Cancelar</button><button class="primary" id="ss">${label}</button></div></div>`;document.body.appendChild(w);const close=()=>w.remove();w.querySelector('#xx').onclick=close;w.querySelector('#cc').onclick=close;w.querySelector('#ss').onclick=()=>{if(onSave(w)!==false)close()}}
function active(view){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function show(view){active(view);views[view]()}window.show=show;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
function configureProduct(id='cake'){
 const p=state.products.find(x=>x.id===id);
 modal('Configurar '+p.name,`
 <div class="hint"><b>Este producto no trae medidas ni recetas predeterminadas.</b> Tú decides cómo trabaja tu negocio. En cada lista escribe una opción por línea usando <b>Nombre | valor</b>.</div>
 <div class="form2">${f('Nombre del producto','pn','text',p.name)}${f('Margen objetivo %','pm','number',p.margin)}${f('Nombre de la sección de variantes','vl','text',p.variantLabel)}${f('Nombre de la sección de tamaños','sl','text',p.sizeLabel)}${f('Nombre de receta base','bl','text',p.baseLabel)}${f('Nombre de relleno','fl','text',p.fillingLabel)}${f('Nombre de cobertura','cl','text',p.coverLabel)}</div>
 <div class="cfg"><h4>1. Variantes / presentación</h4>${ta('Opciones','variants',lines(p.variants),'Ej.: Estándar|0   Premium|80   2 niveles|250. El valor es ajuste de costo.')}</div>
 <div class="cfg"><h4>2. Tamaños / rendimientos</h4>${ta('Tamaños','sizes',lines(p.sizes),'Ej.: 18 cm / 15 porciones|1   24 cm / 30 porciones|1.6. El valor es multiplicador de receta.')}</div>
 <div class="cfg"><h4>3. Recetas base</h4>${ta('Recetas disponibles','bases',lines(p.bases),'Ej.: Vainilla|182   Chocolate|205. El valor es costo por receta/rendimiento base.')}</div>
 <div class="cfg"><h4>4. Rellenos y coberturas</h4><div class="form2">${ta('Rellenos','fills',lines(p.fillings),'Nombre|costo')}${ta('Coberturas','covers',lines(p.covers),'Nombre|costo')}</div><div class="checks"><label><input id="sf" type="checkbox" ${p.showFillings?'checked':''}> Usar rellenos</label><label><input id="sc" type="checkbox" ${p.showCovers?'checked':''}> Usar coberturas</label></div></div>
 <div class="cfg"><h4>5. Extras</h4>${ta('Extras','extras',lines(p.extras),'Ej.: Topper|35   Flores|70   Fondant|95')}</div>
 `,w=>{
  p.name=w.querySelector('#pn').value.trim()||p.name;p.margin=Number(w.querySelector('#pm').value)||50;
  p.variantLabel=w.querySelector('#vl').value.trim()||'Variante';p.sizeLabel=w.querySelector('#sl').value.trim()||'Tamaño';p.baseLabel=w.querySelector('#bl').value.trim()||'Receta';p.fillingLabel=w.querySelector('#fl').value.trim()||'Relleno';p.coverLabel=w.querySelector('#cl').value.trim()||'Cobertura';
  p.variants=parseLines(w.querySelector('#variants').value);p.sizes=parseLines(w.querySelector('#sizes').value);p.bases=parseLines(w.querySelector('#bases').value);p.fillings=parseLines(w.querySelector('#fills').value);p.covers=parseLines(w.querySelector('#covers').value);p.extras=parseLines(w.querySelector('#extras').value);p.showFillings=w.querySelector('#sf').checked;p.showCovers=w.querySelector('#sc').checked;
  p.configured=p.sizes.length>0&&p.bases.length>0;save();toast('Configuración guardada');show('quotes')
 })
}window.configureProduct=configureProduct;
function choices(id,items,multi=false){return `<div class="choice" id="${id}">${items.map((x,i)=>`<button data-i="${i}" class="${!multi&&i===0?'active':''}">${x.name}</button>`).join('')}</div>`}
function quote(id='cake'){
 const p=state.products.find(x=>x.id===id);if(!p.configured){toast('Primero configura este producto');configureProduct(id);return}
 titleEl.textContent='Cotizador · '+p.name;
 content.innerHTML=`<div class="section-head"><div><button class="secondary" onclick="show('quotes')">← Volver</button><h1 style="margin-top:14px">${p.name}</h1><p class="muted">El formulario fue generado con la configuración de este negocio.</p></div><button class="secondary" onclick="configureProduct('${p.id}')">Editar configuración</button></div>
 <div class="form2">${f('Cliente','qc','text','Mariana López')}${f('Fecha del evento','qd','date','')}${f('Hora','qt','time','')}${f('Notas / diseño','qn','text','')}</div>
 <div class="qgrid"><div class="qbox">
 ${p.variants.length?`<div class="cfg"><h4>${p.variantLabel}</h4>${choices('qvar',p.variants)}</div>`:''}
 <div class="cfg"><h4>${p.sizeLabel}</h4>${choices('qsize',p.sizes)}</div>
 <div class="cfg"><h4>${p.baseLabel}</h4>${choices('qbase',p.bases)}</div>
 ${p.showFillings&&p.fillings.length?`<div class="cfg"><h4>${p.fillingLabel}</h4>${choices('qfill',p.fillings)}</div>`:''}
 ${p.showCovers&&p.covers.length?`<div class="cfg"><h4>${p.coverLabel}</h4>${choices('qcover',p.covers)}</div>`:''}
 ${p.extras.length?`<div class="cfg"><h4>Extras</h4>${choices('qextras',p.extras,true)}</div>`:''}
 <div class="cfg"><h4>Ajuste final</h4><div class="form2">${f('Extra libre $','qfree','number','0')}${f('Descuento / cupón %','qdisc','number','0')}${f('Precio manual (opcional)','qmanual','number','0')}</div></div>
 </div><div class="qsum" id="sum"></div></div>`;
 let vi=0,si=0,bi=0,fi=0,ci=0;
 function single(id,setter){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('active'));b.classList.add('active');setter(Number(b.dataset.i));calc()})}
 if(p.variants.length)single('qvar',i=>vi=i);single('qsize',i=>si=i);single('qbase',i=>bi=i);if(p.showFillings&&p.fillings.length)single('qfill',i=>fi=i);if(p.showCovers&&p.covers.length)single('qcover',i=>ci=i);
 document.querySelectorAll('#qextras button').forEach(b=>b.onclick=()=>{b.classList.toggle('active');calc()});
 function calc(){const mult=p.sizes[si]?.value||1;base=p.bases[bi]?.value||0;variant=p.variants[vi]?.value||0;fill=p.showFillings?(p.fillings[fi]?.value||0):0;cover=p.showCovers?(p.covers[ci]?.value||0):0;extras=[...document.querySelectorAll('#qextras .active')].reduce((s,b)=>s+(p.extras[Number(b.dataset.i)]?.value||0),0);free=Number(document.getElementById('qfree').value)||0;cost=Math.max(0,(base+fill+cover)*mult+variant+extras+free);margin=Math.min(95,Math.max(1,p.margin||50));price=Math.round(cost/(1-margin/100));disc=Number(document.getElementById('qdisc').value)||0;price=Math.round(price*(1-disc/100));manual=Number(document.getElementById('qmanual').value)||0;if(manual>0)price=manual;profit=price-cost;document.getElementById('sum').innerHTML=`<h3>Resumen</h3><div class="r"><span>Costo estimado</span><b>${mx(cost)}</b></div><div class="r"><span>Ganancia</span><b>${mx(profit)}</b></div><div class="r"><span>Margen real</span><b>${price?Math.round(profit/price*100):0}%</b></div><div class="r total"><span>Precio</span><b>${mx(price)}</b></div><button class="secondary full" onclick="toast('Vista PDF demo')">Vista PDF</button><button class="primary full" style="margin-top:8px" onclick="toast('Cotización guardada')">Guardar cotización</button>`}
 ['qfree','qdisc','qmanual'].forEach(x=>document.getElementById(x).addEventListener('input',calc));calc()
}window.quote=quote;
const views={
 home(){titleEl.textContent='Inicio';content.innerHTML=`<div class="hero"><div><h1>Buenos días 👋</h1><p>Tu negocio, tus recetas y tus reglas.</p></div><button class="primary" onclick="show('quotes')">+ Nueva cotización</button></div><div class="grid4"><div class="card kpi"><small>Ventas del mes</small><strong>$24,580</strong></div><div class="card kpi"><small>Ganancia</small><strong>$10,240</strong></div><div class="card kpi"><small>Pedidos activos</small><strong>12</strong></div><div class="card kpi"><small>Por cobrar</small><strong>$4,850</strong></div></div><div class="card"><h3>Cómo funciona DENYA</h3><p class="muted">Configuras una vez tus productos, medidas, rendimientos y recetas. Después tu equipo solo entra a cotizar.</p></div>`},
 quotes(){titleEl.textContent='Cotizador';const p=state.products[0];content.innerHTML=`<div class="section-head"><div><h1>Cotizador</h1><p class="muted">DENYA no impone tamaños ni recetas. Cada negocio construye su propio cotizador.</p></div><button class="primary" onclick="configureProduct('${p.id}')">${p.configured?'Editar producto':'Configurar producto'}</button></div><div class="card template"><div class="rowhead"><div><span class="tag">Producto configurable</span><h3>${p.name}</h3><p class="muted">Margen objetivo ${p.margin}%</p></div><button class="secondary" onclick="configureProduct('${p.id}')">⚙ Configurar</button></div>${p.configured?`<div class="config-summary"><div><b>${p.variants.length}</b><br>variantes</div><div><b>${p.sizes.length}</b><br>tamaños</div><div><b>${p.bases.length}</b><br>recetas base</div><div><b>${p.extras.length}</b><br>extras</div></div><button class="primary full" style="margin-top:16px" onclick="quote('${p.id}')">Cotizar</button>`:`<div class="empty"><b>Producto sin configurar</b><br><span class="small">Agrega tus medidas, rendimientos y recetas para empezar a cotizar.</span><br><button class="primary" style="margin-top:14px" onclick="configureProduct('${p.id}')">Configurar ahora</button></div>`}</div>`},
 recipes(){titleEl.textContent='Recetas';content.innerHTML=`<div class="section-head"><div><h1>Recetas</h1><p class="muted">Aquí cada negocio registrará sus recetas reales, costos y rendimientos.</p></div><button class="primary" onclick="toast('Nueva receta demo')">+ Nueva receta</button></div><div class="card"><div class="empty">En la versión final, las recetas creadas aquí serán las que aparezcan al configurar productos.</div></div>`},
 production(){titleEl.textContent='Producción';content.innerHTML=`<div class="section-head"><div><h1>Producción</h1><p class="muted">Pedidos aceptados y materiales requeridos.</p></div></div><div class="card"><div class="row"><b>Pedido #1042</b><span class="badge">Preparación</span></div><div class="row"><span>Materiales disponibles</span><b>82%</b></div></div>`},
 inventory(){titleEl.textContent='Inventario';content.innerHTML=`<div class="section-head"><div><h1>Inventario</h1><p class="muted">Ingredientes y existencias del negocio.</p></div><button class="primary" onclick="toast('Nuevo ingrediente demo')">+ Ingrediente</button></div><div class="card"><div class="empty">Inventario del cliente</div></div>`},
 finance(){titleEl.textContent='Finanzas';content.innerHTML=`<div class="section-head"><div><h1>Finanzas</h1><p class="muted">Rentabilidad calculada con los costos reales del negocio.</p></div></div><div class="grid4"><div class="card kpi"><small>Ventas</small><strong>$24,580</strong></div><div class="card kpi"><small>Costos</small><strong>$14,340</strong></div><div class="card kpi"><small>Ganancia</small><strong>$10,240</strong></div><div class="card kpi"><small>Margen</small><strong>41.7%</strong></div></div>`},
 plan(){titleEl.textContent='Mi plan';content.innerHTML=`<div class="section-head"><div><h1>Mi plan</h1><p class="muted">Plan actual: ${state.plan}</p></div></div><div class="plan-grid"><div class="card plan"><h3>Emprende</h3><div class="pricebig">$249<small>/mes</small></div></div><div class="card plan current"><h3>Negocio</h3><div class="pricebig">$449<small>/mes</small></div></div><div class="card plan"><h3>Pro</h3><div class="pricebig">$699<small>/mes</small></div></div>`}
};
show('home');
</script>
</body></html>
