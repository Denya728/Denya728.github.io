<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENYA 2.0 Demo</title>
<link rel="stylesheet" href="style.css">
<style>
.quote-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-top:18px}.quote-panel{background:#fff;border:1px solid #ebe4dd;border-radius:18px;padding:20px}.quote-summary{background:#2f261f;color:#fff;border-radius:18px;padding:20px;align-self:start;position:sticky;top:100px}.quote-summary .line{display:flex;justify-content:space-between;gap:10px;padding:8px 0}.quote-summary .total{border-top:1px solid #67584d;margin-top:10px;padding-top:14px;font-size:22px;font-weight:800}.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field2{display:grid;gap:6px;margin:10px 0;font-size:13px;font-weight:700}.field2 input,.field2 select,.field2 textarea{border:1px solid #ded5ce;border-radius:12px;padding:11px;font:inherit;background:white}.step2{padding:14px 0;border-bottom:1px solid #eee7e1}.step2:last-child{border-bottom:0}.step2 h4{margin:0 0 8px}.full{width:100%}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.mini{font-size:12px;color:#81756c}.modal-bg2{position:fixed;inset:0;background:rgba(20,16,13,.55);display:grid;place-items:center;padding:20px;z-index:50}.modal2{width:min(760px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.dessert-row{display:grid;grid-template-columns:1fr 110px 42px;gap:8px;margin:8px 0}.dessert-row select,.dessert-row input{border:1px solid #ded5ce;border-radius:10px;padding:10px}@media(max-width:900px){.quote-grid,.form-row,.checks{grid-template-columns:1fr}.quote-summary{position:static}}
</style>
</head>
<body>
<div class="app"><aside><div class="brand">✦ DENYA</div><div class="biz">SweetLab</div><nav><button class="active" data-view="home">Inicio</button><button data-view="quotes">Cotizador</button><button data-view="recipes">Recetas</button><button data-view="production">Producción</button><button data-view="inventory">Inventario</button><button data-view="finance">Finanzas</button><button data-view="plan">Mi plan</button></nav><div class="foot">Demo cliente · DENYA 2.0</div></aside><main><header><div><small>SweetLab</small><h2 id="title">Inicio</h2></div><div class="avatar">S</div></header><section id="content"></section></main></div>
<script>
const state={plan:'Negocio',products:[{id:'cake',name:'Pastel personalizado',type:'cake',margin:55},{id:'cheese',name:'Cheesecake',type:'cheese',margin:50},{id:'table',name:'Mesa de postres',type:'table',margin:52}],recipes:{pan:[['Vainilla',182],['Chocolate',205],['Red velvet',225]],filling:[['Frutos rojos',126],['Chocolate',154],['Cajeta',118]],cover:[['Buttercream',168],['Ganache',190]],cheese:[['Clásico',285],['Frutos rojos',335],['Pistacho',395]],dessert:[['Galleta NY',18],['Macaron',14],['Beso de cacao',11],['Cheesecake individual',32]]}};
const content=document.getElementById('content'),titleEl=document.getElementById('title');const mx=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(n)||0);
function toast(msg){let t=document.getElementById('toast2');if(!t){t=document.createElement('div');t.id='toast2';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function field(label,id,type='text',value=''){return '<label class="field2">'+label+'<input id="'+id+'" type="'+type+'" value="'+value+'"></label>'}function selectField(label,id,items){return '<label class="field2">'+label+'<select id="'+id+'">'+items.map((x,i)=>'<option value="'+i+'">'+x[0]+'</option>').join('')+'</select></label>'}
function modal(title,body,onSave,label='Guardar'){const wrap=document.createElement('div');wrap.className='modal-bg2';wrap.innerHTML='<div class="modal2"><div class="modal-head"><h2>'+title+'</h2><button class="icon-btn" id="x">×</button></div>'+body+'<div class="modal-actions"><button class="secondary" id="cancel">Cancelar</button><button class="primary" id="save">'+label+'</button></div></div>';document.body.appendChild(wrap);const close=()=>wrap.remove();wrap.querySelector('#x').onclick=close;wrap.querySelector('#cancel').onclick=close;wrap.querySelector('#save').onclick=()=>{if(onSave)onSave(wrap);close()}}
function setActive(view){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}function showView(view){setActive(view);views[view]()}window.showView=showView;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function configureProduct(id){const p=state.products.find(x=>x.id===id);modal(p?'Editar producto':'Configurar producto','<div class="form-row">'+field('Nombre','pname','text',p?p.name:'')+'<label class="field2">Tipo<select id="ptype"><option value="cake">Pastel configurable</option><option value="cheese">Producto por tamaño</option><option value="table">Mesa de postres</option><option value="simple">Producto simple</option></select></label>'+field('Margen objetivo %','pmargin','number',p?p.margin:55)+'</div><div class="notice"><b>Recetas propias.</b> Cada negocio conecta aquí sus recetas, rendimientos y costos.</div><div class="checks"><label><input type="checkbox" checked> Tamaño / personas</label><label><input type="checkbox" checked> Sabor</label><label><input type="checkbox" checked> Relleno</label><label><input type="checkbox" checked> Cobertura</label><label><input type="checkbox" checked> Extras múltiples</label><label><input type="checkbox" checked> Cupón / descuento</label></div>',w=>{const name=w.querySelector('#pname').value.trim();if(!name)return;if(p){p.name=name;p.margin=Number(w.querySelector('#pmargin').value)||55}else{state.products.push({id:'p'+Date.now(),name,type:w.querySelector('#ptype').value,margin:Number(w.querySelector('#pmargin').value)||55})}toast('Producto guardado');showView('quotes')})}window.configureProduct=configureProduct;
function quoteHeader(name){return '<div class="section-head"><div><button class="secondary" onclick="showView(\'quotes\')">← Volver</button><h1 style="margin-top:14px">'+name+'</h1><p class="muted">Recetas, costos y rendimientos del propio negocio.</p></div></div><div class="form-row">'+field('Cliente','qclient','text','Mariana López')+field('Fecha del evento','qdate','date')+field('Hora','qtime','time')+field('Notas / diseño','qnotes','text')+'</div>'}
function cakeQuote(){titleEl.textContent='Cotizador · Pastel';content.innerHTML=quoteHeader('Pastel personalizado')+'<div class="quote-grid"><div class="quote-panel"><div class="step2"><h4>1. Tipo de pastel</h4><div class="chips" id="ctype"><button class="chip active" data-v="0">Bajo</button><button class="chip" data-v="90">Alto</button><button class="chip" data-v="260">2 pisos</button><button class="chip" data-v="-120">Cupcakes</button></div></div><div class="step2"><h4>2. Tamaño / personas</h4><div class="chips" id="csize"><button class="chip" data-v="-90">15 cm · 10–15</button><button class="chip active" data-v="0">20 cm · 20–30</button><button class="chip" data-v="150">25 cm · 35–45</button><button class="chip" data-v="290">30 cm · 50–70</button></div></div><div class="step2"><h4>3. Sabor de pan</h4>'+selectField('Receta','cpan',state.recipes.pan)+'</div><div class="step2"><h4>4. Relleno</h4>'+selectField('Receta','cfill',state.recipes.filling)+'</div><div class="step2"><h4>5. Cobertura</h4>'+selectField('Receta','ccover',state.recipes.cover)+'</div><div class="step2"><h4>6. Extras</h4><div class="chips" id="cextra"><button class="chip" data-v="35">Topper +$35</button><button class="chip" data-v="95">Fondant +$95</button><button class="chip" data-v="70">Flores +$70</button><button class="chip" data-v="45">Perlas +$45</button><button class="chip" data-v="120">Figura +$120</button></div><div class="form-row">'+field('Extra libre','cfree')+field('Costo extra','cfreecost','number','0')+'</div></div><div class="step2"><h4>7. Ajuste final</h4><div class="form-row">'+field('Descuento / cupón %','cdisc','number','0')+field('Precio manual','cmanual','number','0')+'</div></div></div><div class="quote-summary" id="csum"></div></div>';let typeAdd=0,sizeAdd=0,extraAdd=0;function single(id,cb){document.querySelectorAll('#'+id+' .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');cb(Number(b.dataset.v)||0);calc()})}single('ctype',v=>typeAdd=v);single('csize',v=>sizeAdd=v);document.querySelectorAll('#cextra .chip').forEach(b=>b.onclick=()=>{b.classList.toggle('active');extraAdd=[...document.querySelectorAll('#cextra .active')].reduce((s,x)=>s+(Number(x.dataset.v)||0),0);calc()});function calc(){const pan=state.recipes.pan[Number(document.getElementById('cpan').value)][1],fill=state.recipes.filling[Number(document.getElementById('cfill').value)][1],cover=state.recipes.cover[Number(document.getElementById('ccover').value)][1],free=Number(document.getElementById('cfreecost').value)||0;const cost=Math.max(0,pan+fill+cover+95+typeAdd+sizeAdd+extraAdd+free);let price=Math.round(cost/.45);price=Math.round(price*(1-(Number(document.getElementById('cdisc').value)||0)/100));const manual=Number(document.getElementById('cmanual').value)||0;if(manual>0)price=manual;const profit=price-cost;document.getElementById('csum').innerHTML='<h3>Resumen</h3><div class="line"><span>Costo estimado</span><b>'+mx(cost)+'</b></div><div class="line"><span>Ganancia</span><b>'+mx(profit)+'</b></div><div class="line"><span>Margen real</span><b>'+(price?Math.round(profit/price*100):0)+'%</b></div><div class="line total"><span>Precio</span><b>'+mx(price)+'</b></div><button class="secondary full" onclick="toast(\'Vista PDF demo\')">Vista PDF</button><button class="primary full" style="margin-top:8px" onclick="toast(\'Cotización guardada\')">Guardar cotización</button>'}['cpan','cfill','ccover','cfreecost','cdisc','cmanual'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc()}window.cakeQuote=cakeQuote;
function cheesecakeQuote(){titleEl.textContent='Cotizador · Cheesecake';content.innerHTML=quoteHeader('Cheesecake')+'<div class="quote-grid"><div class="quote-panel"><div class="step2"><h4>1. Sabor / receta</h4>'+selectField('Receta','hrecipe',state.recipes.cheese)+'</div><div class="step2"><h4>2. Tamaño</h4><div class="chips" id="hsize"><button class="chip active" data-f="1">Chico · 8–10</button><button class="chip" data-f="1.35">Mediano · 12–15</button><button class="chip" data-f="1.75">Grande · 18–22</button></div></div><div class="step2"><div class="form-row">'+field('Cantidad','hqty','number','1')+field('Decoración extra','hextra','number','0')+field('Descuento %','hdisc','number','0')+'</div></div></div><div class="quote-summary" id="hsum"></div></div>';let factor=1;document.querySelectorAll('#hsize .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#hsize .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');factor=Number(b.dataset.f)||1;calc()});function calc(){const r=state.recipes.cheese[Number(document.getElementById('hrecipe').value)],qty=Math.max(1,Number(document.getElementById('hqty').value)||1),cost=r[1]*factor*qty+(Number(document.getElementById('hextra').value)||0);let price=Math.round(cost/.5);price=Math.round(price*(1-(Number(document.getElementById('hdisc').value)||0)/100));document.getElementById('hsum').innerHTML='<h3>Resumen</h3><div class="line"><span>Costo</span><b>'+mx(cost)+'</b></div><div class="line"><span>Ganancia</span><b>'+mx(price-cost)+'</b></div><div class="line total"><span>Total</span><b>'+mx(price)+'</b></div><button class="primary full" onclick="toast(\'Cotización guardada\')">Guardar cotización</button>'}['hrecipe','hqty','hextra','hdisc'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc()}window.cheesecakeQuote=cheesecakeQuote;
function dessertTableQuote(){titleEl.textContent='Cotizador · Mesa de postres';content.innerHTML=quoteHeader('Mesa de postres')+'<div class="quote-grid"><div class="quote-panel"><div class="step2"><h4>1. Postres</h4><div id="dlines"></div><button class="secondary" id="dadd">+ Agregar postre</button></div><div class="step2"><h4>2. Servicio</h4><div class="form-row">'+field('Montaje / mobiliario','dsetup','number','0')+field('Entrega','ddelivery','number','0')+field('Descuento %','ddisc','number','0')+'</div></div></div><div class="quote-summary" id="dsum"></div></div>';let lines=[{r:0,q:20},{r:1,q:20}];function draw(){const box=document.getElementById('dlines');box.innerHTML=lines.map((l,i)=>'<div class="dessert-row"><select data-i="'+i+'" data-k="r">'+state.recipes.dessert.map((x,j)=>'<option value="'+j+'" '+(j===l.r?'selected':'')+'>'+x[0]+'</option>').join('')+'</select><input data-i="'+i+'" data-k="q" type="number" value="'+l.q+'" min="1"><button class="icon-btn" data-rm="'+i+'">×</button></div>').join('');box.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{lines[Number(el.dataset.i)][el.dataset.k]=Number(el.value)||0;calc()});box.querySelectorAll('[data-rm]').forEach(el=>el.onclick=()=>{lines.splice(Number(el.dataset.rm),1);draw()});calc()}function calc(){const products=lines.reduce((s,l)=>s+state.recipes.dessert[l.r][1]*l.q,0),cost=products+(Number(document.getElementById('dsetup').value)||0)+(Number(document.getElementById('ddelivery').value)||0);let price=Math.round(cost/.48);price=Math.round(price*(1-(Number(document.getElementById('ddisc').value)||0)/100));document.getElementById('dsum').innerHTML='<h3>Resumen</h3>'+lines.map(l=>'<div class="line"><span>'+state.recipes.dessert[l.r][0]+' × '+l.q+'</span><b>'+mx(state.recipes.dessert[l.r][1]*l.q)+'</b></div>').join('')+'<div class="line"><span>Costo</span><b>'+mx(cost)+'</b></div><div class="line"><span>Ganancia</span><b>'+mx(price-cost)+'</b></div><div class="line total"><span>Total</span><b>'+mx(price)+'</b></div><button class="primary full" onclick="toast(\'Cotización guardada\')">Guardar cotización</button>'}document.getElementById('dadd').onclick=()=>{lines.push({r:0,q:12});draw()};['dsetup','ddelivery','ddisc'].forEach(id=>document.getElementById(id).addEventListener('input',calc));draw()}window.dessertTableQuote=dessertTableQuote;
const views={home(){titleEl.textContent='Inicio';content.innerHTML='<div class="hero"><div><h1>Buenos días 👋</h1><p>Así va SweetLab hoy.</p></div><button class="primary" onclick="showView(\'quotes\')">+ Nueva cotización</button></div><div class="grid4"><div class="card kpi"><small>Ventas del mes</small><strong>$24,580</strong></div><div class="card kpi"><small>Ganancia</small><strong>$10,240</strong></div><div class="card kpi"><small>Pedidos activos</small><strong>12</strong></div><div class="card kpi"><small>Por cobrar</small><strong>$4,850</strong></div></div><div class="grid2"><div class="card"><h3>Próximos pedidos</h3><div class="row"><span>Pastel floral 20 cm</span><span class="badge">Producción</span></div><div class="row"><span>Mesa de postres</span><span class="badge">Confirmado</span></div><div class="row"><span>Cheesecake pistacho</span><span class="badge">Pendiente</span></div></div><div class="card"><h3>Acciones rápidas</h3><div class="actions"><button class="action" onclick="showView(\'quotes\')">✦ Cotizar</button><button class="action" onclick="toast(\'Cliente demo\')">◉ Cliente</button><button class="action" onclick="toast(\'Compra demo\')">↓ Compra</button><button class="action" onclick="showView(\'production\')">◇ Producción</button></div></div></div>'},quotes(){titleEl.textContent='Cotizador';const cards=state.products.map(p=>{const label=p.type==='cake'?'Pastel':p.type==='cheese'?'Cheesecake':p.type==='table'?'Mesa de postres':'Producto';const action=p.type==='cake'?'cakeQuote()':p.type==='cheese'?'cheesecakeQuote()':p.type==='table'?'dessertTableQuote()':'toast(&quot;Producto simple demo&quot;)';return '<div class="card template"><div class="top-actions"><span class="badge">'+label+'</span><button class="secondary" onclick="configureProduct(\''+p.id+'\')">Configurar</button></div><h3>'+p.name+'</h3><p class="muted">Margen objetivo '+p.margin+'%</p><button class="primary full" onclick="'+action+'">Cotizar</button></div>'}).join('');content.innerHTML='<div class="section-head"><div><h1>Cotizador</h1><p class="muted">La lógica de tu sistema, simplificada para cada negocio.</p></div><button class="secondary" onclick="configureProduct()">+ Configurar producto</button></div><div class="notice"><b>Cada cliente usa sus propias recetas.</b> El cotizador solo las organiza y calcula.</div><div class="templates">'+cards+'</div>'},recipes(){titleEl.textContent='Recetas';content.innerHTML='<div class="section-head"><div><h1>Recetas y costos</h1><p class="muted">Recetas propias del negocio.</p></div><button class="primary" onclick="toast(\'Nueva receta demo\')">+ Nueva receta</button></div><div class="card"><table class="table"><tr><th>Receta</th><th>Rendimiento</th><th>Costo</th></tr><tr><td>Pan de vainilla</td><td>1 molde 20 cm</td><td>$182</td></tr><tr><td>Buttercream</td><td>1.2 kg</td><td>$168</td></tr><tr><td>Relleno frutos rojos</td><td>800 g</td><td>$126</td></tr></table></div>'},production(){titleEl.textContent='Producción';content.innerHTML='<div class="section-head"><div><h1>Producción</h1><p class="muted">Pedidos, materiales y avance.</p></div><button class="primary" onclick="toast(\'Producción creada\')">+ Producción</button></div><div class="grid2"><div class="card"><div class="row"><span>Pastel floral</span><span class="badge">Preparación</span></div><div class="row"><span>Cheesecake pistacho</span><span class="badge">Pendiente</span></div></div><div class="card"><h3>Materiales</h3><div class="row"><span>Chocolate</span><b class="stock-low">Faltan 500 g</b></div><button class="secondary" onclick="toast(\'Compra creada\')">Crear compra</button></div></div>'},inventory(){titleEl.textContent='Inventario';content.innerHTML='<div class="section-head"><div><h1>Inventario</h1><p class="muted">Existencias y costos.</p></div><button class="primary" onclick="toast(\'Ingrediente agregado\')">+ Ingrediente</button></div><div class="card"><table class="table"><tr><th>Ingrediente</th><th>Disponible</th><th>Costo</th></tr><tr><td>Chocolate</td><td>12.4 kg</td><td>$178/kg</td></tr><tr><td>Crema</td><td>2.1 L</td><td>$96/L</td></tr><tr><td>Harina</td><td>18 kg</td><td>$31/kg</td></tr></table></div>'},finance(){titleEl.textContent='Finanzas';content.innerHTML='<div class="section-head"><div><h1>Finanzas</h1><p class="muted">Rentabilidad real.</p></div></div><div class="grid4"><div class="card kpi"><small>Ventas</small><strong>$24,580</strong></div><div class="card kpi"><small>Costos</small><strong>$14,340</strong></div><div class="card kpi"><small>Ganancia</small><strong>$10,240</strong></div><div class="card kpi"><small>Margen</small><strong>41.7%</strong></div></div>'},plan(){titleEl.textContent='Mi plan';content.innerHTML='<div class="section-head"><div><h1>Mi plan</h1><p class="muted">Planes para cada etapa.</p></div></div><div class="plan-grid"><div class="card plan"><h3>Emprende</h3><div class="pricebig">$249<small>/mes</small></div></div><div class="card plan current"><h3>Negocio</h3><div class="pricebig">$449<small>/mes</small></div><button class="primary full">Plan actual</button></div><div class="card plan"><h3>Pro</h3><div class="pricebig">$699<small>/mes</small></div></div></div>'}};showView('home');
</script>
</body>
</html>
