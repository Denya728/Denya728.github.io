<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENYA 2.0 Demo</title>
<link rel="stylesheet" href="style.css">
<style>
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.flow .card{padding:16px}.flow b{display:block;margin-bottom:5px}.flow span{font-size:12px;color:#81756c}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product-card{position:relative}.product-card.off{opacity:.5}.product-card h3{margin:4px 0 6px}.product-price{font-size:23px;font-weight:800;margin:14px 0}.inline-input{width:120px;border:1px solid #ded5ce;border-radius:10px;padding:9px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f3ece5;font-size:12px}.switch{display:flex;gap:7px;align-items:center;font-size:13px}.module-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{padding:13px;border-bottom:1px solid #eee7e1;text-align:left;vertical-align:top}.data-table th{font-size:12px;color:#81756c}.empty{padding:34px;text-align:center;color:#81756c}.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fieldx{display:grid;gap:6px;font-size:13px;font-weight:700;color:#5e5148}.fieldx input,.fieldx select,.fieldx textarea{width:100%;border:1px solid #ded5ce;border-radius:12px;padding:11px;font:inherit;background:#fff}.modal-bg3{position:fixed;inset:0;background:rgba(20,16,13,.55);display:grid;place-items:center;padding:18px;z-index:80}.modal3{width:min(820px,97vw);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.component-row{display:grid;grid-template-columns:130px 1fr 95px 90px 110px 40px;gap:7px;margin:8px 0}.component-row input,.component-row select{border:1px solid #ded5ce;border-radius:10px;padding:9px;width:100%}.recipe-cost{font-size:28px;font-weight:800}.measure-card{margin-bottom:12px}.measure-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.usage-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.usage-chip{background:#f5efe9;border-radius:999px;padding:6px 10px;font-size:12px}.quote-layout{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.quote-box{background:#fff;border:1px solid #ebe4dd;border-radius:18px;padding:20px}.quote-summary{background:#2f261f;color:#fff;border-radius:18px;padding:20px;align-self:start;position:sticky;top:100px}.quote-summary .line{display:flex;justify-content:space-between;padding:8px 0;gap:12px}.quote-summary .total{border-top:1px solid #66564b;margin-top:10px;padding-top:15px;font-size:22px;font-weight:800}.recipe-badge{display:inline-block;background:#f3ece5;border-radius:999px;padding:6px 9px;font-size:12px;margin:3px}.notice2{background:#f8f3ee;border:1px solid #eadfd6;border-radius:14px;padding:14px;color:#66584e;margin:12px 0}.section-card{background:#fff;border:1px solid #ebe4dd;border-radius:18px;padding:18px;margin-bottom:14px}.section-card h3{margin-top:0}.right{text-align:right}.danger{background:#fff1ef;color:#9b3328;border:0;border-radius:10px;padding:9px 11px;cursor:pointer}.smallbtn{border:0;border-radius:10px;padding:9px 11px;cursor:pointer;background:#eee6df;font-weight:700}.stepnote{font-size:12px;color:#81756c;margin-top:4px}@media(max-width:950px){.flow,.catalog{grid-template-columns:1fr 1fr}.quote-layout,.form2{grid-template-columns:1fr}.quote-summary{position:static}.component-row{grid-template-columns:1fr 1fr}.component-row button{grid-column:span 2}}@media(max-width:620px){.flow,.catalog{grid-template-columns:1fr}.module-head{align-items:flex-start;flex-direction:column}.data-table{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand">✦ DENYA</div>
<div class="biz">SweetLab</div>
<nav>
<button class="active" data-view="home">Inicio</button>
<button data-view="products">Productos</button>
<button data-view="recipes">Recetas</button>
<button data-view="measures">Medidas / rendimientos</button>
<button data-view="quotes">Cotizador</button>
<button data-view="production">Producción</button>
<button data-view="inventory">Inventario</button>
<button data-view="finance">Finanzas</button>
<button data-view="plan">Mi plan</button>
</nav>
<div class="foot">Demo cliente · DENYA 2.0</div>
</aside>
<main><header><div><small>SweetLab</small><h2 id="title">Inicio</h2></div><div class="avatar">S</div></header><section id="content"></section></main>
</div>
<script>
const seed={
 products:[
 {id:'cake',name:'Pastel personalizado',category:'Pasteles',price:0,active:true,margin:55},
 {id:'cheese',name:'Cheesecake',category:'Postres',price:0,active:true,margin:50},
 {id:'cupcakes',name:'Cupcakes',category:'Cupcakes',price:0,active:true,margin:55},
 {id:'brownies',name:'Brownies',category:'Postres',price:0,active:true,margin:50},
 {id:'cookies',name:'Galletas',category:'Galletas',price:0,active:true,margin:55},
 {id:'macarons',name:'Macarons',category:'Postres',price:0,active:true,margin:55},
 {id:'cakepops',name:'Cake pops',category:'Postres',price:0,active:false,margin:55},
 {id:'desserttable',name:'Mesa de postres',category:'Eventos',price:0,active:true,margin:50}
 ],
 recipes:[
 {id:'rv1',name:'Pan vainilla ejemplo',category:'Bases',yield:1,unit:'receta',components:[{type:'Ingrediente',name:'Harina',qty:0.5,unit:'kg',unitCost:32},{type:'Ingrediente',name:'Huevo',qty:8,unit:'pz',unitCost:4.2},{type:'Ingrediente',name:'Azúcar',qty:0.4,unit:'kg',unitCost:30}],cost:61.6},
 {id:'rr1',name:'Relleno frutos rojos ejemplo',category:'Rellenos',yield:1,unit:'receta',components:[{type:'Ingrediente',name:'Frutos rojos',qty:0.5,unit:'kg',unitCost:170},{type:'Ingrediente',name:'Azúcar',qty:0.15,unit:'kg',unitCost:30}],cost:89.5},
 {id:'rb1',name:'Buttercream vainilla ejemplo',category:'Coberturas',yield:1,unit:'receta',components:[{type:'Ingrediente',name:'Mantequilla',qty:0.5,unit:'kg',unitCost:190},{type:'Ingrediente',name:'Azúcar glass',qty:0.75,unit:'kg',unitCost:48}],cost:131}
 ],
 measures:[
 {id:'m1',productId:'cake',name:'Ejemplo 20 cm',servings:'20–25 personas',usage:[{recipeId:'rv1',qty:1},{recipeId:'rr1',qty:.5},{recipeId:'rb1',qty:.8}]}
 ],
 plan:'Negocio'
};
let state=loadState();
function loadState(){try{const x=localStorage.getItem('denya_demo_v5');return x?JSON.parse(x):structuredClone(seed)}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem('denya_demo_v5',JSON.stringify(state))}
const content=document.getElementById('content'),titleEl=document.getElementById('title');
const mx=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2}).format(Number(n)||0);
function toast(msg){let t=document.getElementById('toastx');if(!t){t=document.createElement('div');t.id='toastx';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function field(label,id,type='text',value=''){return '<label class="fieldx">'+label+'<input id="'+id+'" type="'+type+'" value="'+String(value??'').replace(/"/g,'&quot;')+'"></label>'}
function select(label,id,options,value=''){return '<label class="fieldx">'+label+'<select id="'+id+'">'+options.map(o=>'<option value="'+o.value+'" '+(String(o.value)===String(value)?'selected':'')+'>'+o.label+'</option>').join('')+'</select></label>'}
function modal(title,body,onSave,label='Guardar'){const w=document.createElement('div');w.className='modal-bg3';w.innerHTML='<div class="modal3"><div class="modal-head"><h2>'+title+'</h2><button class="icon-btn" id="mx">×</button></div>'+body+'<div class="modal-actions"><button class="secondary" id="mc">Cancelar</button><button class="primary" id="ms">'+label+'</button></div></div>';document.body.appendChild(w);const close=()=>w.remove();w.querySelector('#mx').onclick=close;w.querySelector('#mc').onclick=close;w.querySelector('#ms').onclick=()=>{if(onSave)onSave(w);close()};return w}
function setActive(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
function show(v){setActive(v);views[v]()}window.show=show;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
function recipeCost(r){return (r.components||[]).reduce((s,c)=>s+(Number(c.qty)||0)*(Number(c.unitCost)||0),0)}
function productCost(productId,measureId){const m=state.measures.find(x=>x.id===measureId&&x.productId===productId);if(!m)return 0;return (m.usage||[]).reduce((s,u)=>{const r=state.recipes.find(x=>x.id===u.recipeId);return s+(r?recipeCost(r)*(Number(u.qty)||0):0)},0)}
function addProduct(){modal('Agregar producto','<div class="form2">'+field('Nombre del producto','pn')+field('Categoría','pc','text','Otro')+field('Precio base (opcional)','pp','number','0')+field('Margen objetivo %','pm','number','50')+'</div><div class="notice2">El precio base es opcional. Para productos elaborados por receta, DENYA puede calcular el precio desde su costo real.</div>',w=>{const name=w.querySelector('#pn').value.trim();if(!name)return;state.products.push({id:'p'+Date.now(),name,category:w.querySelector('#pc').value||'Otro',price:Number(w.querySelector('#pp').value)||0,margin:Number(w.querySelector('#pm').value)||50,active:true});save();show('products');toast('Producto agregado')})}
function editProduct(id){const p=state.products.find(x=>x.id===id);modal('Editar producto','<div class="form2">'+field('Nombre','epn','text',p.name)+field('Categoría','epc','text',p.category)+field('Precio base','epp','number',p.price)+field('Margen objetivo %','epm','number',p.margin)+'</div>',w=>{p.name=w.querySelector('#epn').value||p.name;p.category=w.querySelector('#epc').value||p.category;p.price=Number(w.querySelector('#epp').value)||0;p.margin=Number(w.querySelector('#epm').value)||50;save();show('products')})}
function toggleProduct(id){const p=state.products.find(x=>x.id===id);p.active=!p.active;save();show('products')}
window.addProduct=addProduct;window.editProduct=editProduct;window.toggleProduct=toggleProduct;
function newRecipe(){let rows=[{type:'Ingrediente',name:'',qty:1,unit:'g',unitCost:0}];const w=modal('Nueva receta','<div class="form2">'+field('Nombre de receta','rn')+select('Categoría','rc',[{value:'Bases',label:'Bases / panes'},{value:'Rellenos',label:'Rellenos'},{value:'Coberturas',label:'Coberturas / buttercream'},{value:'Decoraciones',label:'Decoraciones'},{value:'Jarabes',label:'Jarabes / salsas'},{value:'Postres',label:'Postres completos'},{value:'Auxiliares',label:'Preparaciones auxiliares'}])+field('Rendimiento','ry','number','1')+field('Unidad de rendimiento','ru','text','receta')+'</div><div class="section-card"><div class="module-head"><div><h3>Ingredientes / preparaciones</h3><div class="stepnote">Puedes elaborar desde cero un relleno, buttercream, ganache, pan, etc.</div></div><button class="secondary" id="addComp">+ Agregar</button></div><div id="compRows"></div><div class="right"><span class="muted">Costo estimado</span><div class="recipe-cost" id="rcost">$0</div></div></div>',wrap=>{const name=wrap.querySelector('#rn').value.trim();if(!name)return;const comps=[...wrap.querySelectorAll('.component-row')].map(r=>({type:r.querySelector('[data-k=type]').value,name:r.querySelector('[data-k=name]').value,qty:Number(r.querySelector('[data-k=qty]').value)||0,unit:r.querySelector('[data-k=unit]').value,unitCost:Number(r.querySelector('[data-k=cost]').value)||0})).filter(x=>x.name);const rec={id:'r'+Date.now(),name,category:wrap.querySelector('#rc').value,yield:Number(wrap.querySelector('#ry').value)||1,unit:wrap.querySelector('#ru').value||'receta',components:comps};rec.cost=recipeCost(rec);state.recipes.push(rec);save();show('recipes');toast('Receta creada')});function draw(){const box=w.querySelector('#compRows');box.innerHTML=rows.map((r,i)=>'<div class="component-row" data-i="'+i+'"><select data-k="type"><option '+(r.type==='Ingrediente'?'selected':'')+'>Ingrediente</option><option '+(r.type==='Otra receta'?'selected':'')+'>Otra receta</option></select><input data-k="name" placeholder="Harina / Buttercream base" value="'+r.name+'"><input data-k="qty" type="number" step="0.01" value="'+r.qty+'"><input data-k="unit" value="'+r.unit+'"><input data-k="cost" type="number" step="0.01" value="'+r.unitCost+'"><button class="icon-btn" data-rm="'+i+'">×</button></div>').join('');box.querySelectorAll('input,select').forEach(el=>el.oninput=calc);box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{rows.splice(Number(b.dataset.rm),1);draw()});calc()}function calc(){let total=0;w.querySelectorAll('.component-row').forEach(r=>total+=(Number(r.querySelector('[data-k=qty]').value)||0)*(Number(r.querySelector('[data-k=cost]').value)||0));w.querySelector('#rcost').textContent=mx(total)}w.querySelector('#addComp').onclick=()=>{rows.push({type:'Ingrediente',name:'',qty:1,unit:'g',unitCost:0});draw()};draw()}
window.newRecipe=newRecipe;
function deleteRecipe(id){if(!confirm('¿Eliminar esta receta de la demo?'))return;state.recipes=state.recipes.filter(x=>x.id!==id);state.measures.forEach(m=>m.usage=(m.usage||[]).filter(u=>u.recipeId!==id));save();show('recipes')}
window.deleteRecipe=deleteRecipe;
function addMeasure(){const products=state.products.filter(p=>p.active);if(!products.length){toast('Primero activa un producto');return}modal('Nueva medida / presentación','<div class="form2">'+select('Producto','mp',products.map(p=>({value:p.id,label:p.name})))+field('Nombre de medida / presentación','mn','text','Ej. 20 cm')+field('Rendimiento / personas','ms','text','Ej. 20–25 personas')+'</div><div class="notice2">Después de guardarla podrás indicar exactamente cuánto usa de cada receta.</div>',w=>{state.measures.push({id:'m'+Date.now(),productId:w.querySelector('#mp').value,name:w.querySelector('#mn').value||'Presentación',servings:w.querySelector('#ms').value||'',usage:[]});save();show('measures');toast('Presentación creada')})}
function editUsage(id){const m=state.measures.find(x=>x.id===id);const p=state.products.find(x=>x.id===m.productId);const body='<div class="notice2"><b>'+p.name+' · '+m.name+'</b><br>Indica cuánto de cada receta usa esta presentación. Ejemplo: 1 receta de pan, 0.5 de relleno, 0.8 de buttercream.</div><div class="section-card">'+state.recipes.map(r=>{const u=(m.usage||[]).find(x=>x.recipeId===r.id);return '<div class="form2" style="margin-bottom:9px"><div><b>'+r.name+'</b><div class="stepnote">'+r.category+' · costo '+mx(recipeCost(r))+'</div></div>'+field('Cantidad de receta','u_'+r.id,'number',u?u.qty:0)+'</div>'}).join('')+'</div>';modal('Consumo por medida',body,w=>{m.usage=state.recipes.map(r=>({recipeId:r.id,qty:Number(w.querySelector('#u_'+r.id).value)||0})).filter(x=>x.qty>0);save();show('measures');toast('Rendimiento actualizado')})}
function deleteMeasure(id){if(!confirm('¿Eliminar esta medida?'))return;state.measures=state.measures.filter(x=>x.id!==id);save();show('measures')}
window.addMeasure=addMeasure;window.editUsage=editUsage;window.deleteMeasure=deleteMeasure;
function renderQuote(productId){const p=state.products.find(x=>x.id===productId);const measures=state.measures.filter(m=>m.productId===productId);titleEl.textContent='Cotizador · '+p.name;if(!measures.length){content.innerHTML='<div class="section-head"><div><button class="secondary" onclick="show(\'quotes\')">← Volver</button><h1>'+p.name+'</h1></div></div><div class="card empty"><h3>Este producto todavía no tiene medidas o presentaciones.</h3><p>Configúralas primero en Medidas / rendimientos.</p><button class="primary" onclick="show(\'measures\')">Ir a medidas</button></div>';return}content.innerHTML='<div class="section-head"><div><button class="secondary" onclick="show(\'quotes\')">← Volver</button><h1 style="margin-top:12px">'+p.name+'</h1><p class="muted">El cotizador usa únicamente la configuración de este negocio.</p></div></div><div class="quote-layout"><div class="quote-box"><div class="form2">'+field('Cliente','qc','text','Mariana López')+field('Fecha del evento','qd','date')+field('Hora','qt','time')+field('Notas / diseño','qn')+'</div>'+select('Medida / presentación','qm',measures.map(m=>({value:m.id,label:m.name+(m.servings?' · '+m.servings:'')})),measures[0].id)+'<div class="section-card"><h3>Recetas utilizadas</h3><div id="qrecipes"></div></div><div class="form2">'+field('Extras / decoración manual','qextra','number','0')+field('Descuento %','qdisc','number','0')+field('Precio manual (opcional)','qmanual','number','0')+'</div></div><div class="quote-summary" id="qsum"></div></div>';function calc(){const mid=document.getElementById('qm').value,m=state.measures.find(x=>x.id===mid);let cost=productCost(productId,mid);const extras=Number(document.getElementById('qextra').value)||0;cost+=extras;document.getElementById('qrecipes').innerHTML=(m.usage||[]).map(u=>{const r=state.recipes.find(x=>x.id===u.recipeId);return r?'<span class="recipe-badge">'+r.name+' × '+u.qty+'</span>':''}).join('')||'<span class="muted">Sin recetas asignadas</span>';let suggested=p.price>0?p.price:Math.round(cost/(1-(p.margin/100)));let final=suggested*(1-(Number(document.getElementById('qdisc').value)||0)/100);const manual=Number(document.getElementById('qmanual').value)||0;if(manual>0)final=manual;const profit=final-cost;document.getElementById('qsum').innerHTML='<h3>Resumen</h3><div class="line"><span>Costo recetas</span><b>'+mx(cost-extras)+'</b></div><div class="line"><span>Extras</span><b>'+mx(extras)+'</b></div><div class="line"><span>Costo total</span><b>'+mx(cost)+'</b></div><div class="line"><span>Ganancia</span><b>'+mx(profit)+'</b></div><div class="line"><span>Margen real</span><b>'+(final?Math.round(profit/final*100):0)+'%</b></div><div class="line total"><span>Precio final</span><b>'+mx(final)+'</b></div><button class="secondary full" onclick="toast(\'Vista PDF demo\')">Vista PDF</button><button class="primary full" style="margin-top:8px" onclick="toast(\'Cotización guardada\')">Guardar cotización</button>'}['qm','qextra','qdisc','qmanual'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc()}
window.renderQuote=renderQuote;
const views={
home(){titleEl.textContent='Inicio';content.innerHTML='<div class="hero"><div><h1>Buenos días 👋</h1><p>Tu negocio configurado a tu manera.</p></div><button class="primary" onclick="show(\'quotes\')">+ Nueva cotización</button></div><div class="flow"><div class="card"><b>1 · Productos</b><span>Elige qué vendes y agrega lo que falte.</span></div><div class="card"><b>2 · Recetas</b><span>Crea panes, rellenos, buttercreams y preparaciones desde cero.</span></div><div class="card"><b>3 · Medidas</b><span>Indica cuánto usa cada presentación y para cuántas personas rinde.</span></div><div class="card"><b>4 · Cotiza</b><span>DENYA calcula con tus propias reglas.</span></div></div><div class="grid4"><div class="card kpi"><small>Productos activos</small><strong>'+state.products.filter(p=>p.active).length+'</strong></div><div class="card kpi"><small>Recetas</small><strong>'+state.recipes.length+'</strong></div><div class="card kpi"><small>Presentaciones</small><strong>'+state.measures.length+'</strong></div><div class="card kpi"><small>Plan</small><strong style="font-size:20px">'+state.plan+'</strong></div></div><div class="card"><h3>La lógica de DENYA</h3><p class="muted">DENYA no impone tamaños, sabores ni fórmulas. Cada negocio configura sus productos, recetas y rendimientos; el cotizador solamente utiliza esa información.</p></div>'},
products(){titleEl.textContent='Productos';content.innerHTML='<div class="module-head"><div><h1>Productos</h1><p class="muted">DENYA trae una biblioteca inicial. Activa lo que vendes, agrega precio si aplica o crea productos nuevos.</p></div><button class="primary" onclick="addProduct()">+ Agregar producto</button></div><div class="catalog">'+state.products.map(p=>'<div class="card product-card '+(p.active?'':'off')+'"><span class="pill">'+p.category+'</span><h3>'+p.name+'</h3><div class="product-price">'+(p.price?mx(p.price):'Precio por calcular')+'</div><div class="stepnote">Margen objetivo: '+p.margin+'%</div><div class="toolbar" style="margin-top:14px"><button class="smallbtn" onclick="editProduct(\''+p.id+'\')">Editar</button><button class="'+(p.active?'secondary':'primary')+'" onclick="toggleProduct(\''+p.id+'\')">'+(p.active?'Desactivar':'Activar')+'</button></div></div>').join('')+'</div>'},
recipes(){titleEl.textContent='Recetas';content.innerHTML='<div class="module-head"><div><h1>Recetas</h1><p class="muted">Aquí nacen todas las preparaciones: panes, rellenos, buttercreams, ganaches, jarabes, postres y más.</p></div><button class="primary" onclick="newRecipe()">+ Nueva receta</button></div><div class="card"><table class="data-table"><thead><tr><th>Receta</th><th>Categoría</th><th>Rendimiento</th><th>Costo</th><th></th></tr></thead><tbody>'+state.recipes.map(r=>'<tr><td><b>'+r.name+'</b><div class="stepnote">'+(r.components||[]).length+' componentes</div></td><td>'+r.category+'</td><td>'+r.yield+' '+r.unit+'</td><td><b>'+mx(recipeCost(r))+'</b></td><td class="right"><button class="danger" onclick="deleteRecipe(\''+r.id+'\')">Eliminar</button></td></tr>').join('')+'</tbody></table>'+(state.recipes.length?'':'<div class="empty">Todavía no hay recetas.</div>')+'</div>'},
measures(){titleEl.textContent='Medidas / rendimientos';const rows=state.measures.map(m=>{const p=state.products.find(x=>x.id===m.productId);return '<div class="card measure-card"><div class="measure-top"><div><span class="pill">'+(p?p.name:'Producto')+'</span><h3>'+m.name+'</h3><div class="muted">'+(m.servings||'Sin rendimiento definido')+'</div></div><div class="toolbar"><button class="primary" onclick="editUsage(\''+m.id+'\')">Configurar recetas</button><button class="danger" onclick="deleteMeasure(\''+m.id+'\')">Eliminar</button></div></div><div class="usage-list">'+((m.usage||[]).map(u=>{const r=state.recipes.find(x=>x.id===u.recipeId);return r?'<span class="usage-chip">'+r.name+' × '+u.qty+'</span>':''}).join('')||'<span class="muted">Aún no tiene recetas asignadas</span>')+'</div></div>'}).join('');content.innerHTML='<div class="module-head"><div><h1>Medidas y rendimientos</h1><p class="muted">Define tus medidas y cuánto de cada receta necesita cada una.</p></div><button class="primary" onclick="addMeasure()">+ Nueva medida</button></div><div class="notice2">Ejemplo: una presentación de 20 cm puede usar 1 receta de pan, 0.5 de relleno y 0.8 de buttercream. Cada negocio define sus propias cantidades.</div>'+rows+(state.measures.length?'':'<div class="card empty">Todavía no hay medidas configuradas.</div>')},
quotes(){titleEl.textContent='Cotizador';const ps=state.products.filter(p=>p.active);content.innerHTML='<div class="module-head"><div><h1>Cotizador</h1><p class="muted">Aquí ya no se configura el negocio: solamente se cotiza usando Productos + Recetas + Medidas.</p></div></div><div class="catalog">'+ps.map(p=>{const ms=state.measures.filter(m=>m.productId===p.id).length;return '<div class="card product-card"><span class="pill">'+p.category+'</span><h3>'+p.name+'</h3><p class="muted">'+ms+' presentacion(es) configurada(s)</p><button class="primary full" onclick="renderQuote(\''+p.id+'\')" '+(ms?'':'disabled')+'>'+ (ms?'Cotizar':'Configura medidas primero') +'</button></div>'}).join('')+'</div>'},
production(){titleEl.textContent='Producción';content.innerHTML='<div class="module-head"><div><h1>Producción</h1><p class="muted">Las cotizaciones aceptadas pasarán aquí con sus recetas y cantidades calculadas.</p></div></div><div class="grid2"><div class="card"><h3>Pastel ejemplo</h3><div class="row"><span>Pan vainilla</span><b>1 receta</b></div><div class="row"><span>Relleno frutos rojos</span><b>0.5 receta</b></div><div class="row"><span>Buttercream</span><b>0.8 receta</b></div></div><div class="card"><h3>Materiales</h3><p class="muted">En la versión conectada, DENYA convierte estas recetas en una lista real de ingredientes y compras.</p></div></div>'},
inventory(){titleEl.textContent='Inventario';content.innerHTML='<div class="module-head"><div><h1>Inventario</h1><p class="muted">Ingredientes, empaques y existencias alimentan el costo de tus recetas.</p></div></div><div class="card"><table class="data-table"><tr><th>Ingrediente</th><th>Disponible</th><th>Costo</th></tr><tr><td>Harina</td><td>18 kg</td><td>$32/kg</td></tr><tr><td>Mantequilla</td><td>5 kg</td><td>$190/kg</td></tr><tr><td>Azúcar glass</td><td>8 kg</td><td>$48/kg</td></tr></table></div>'},
finance(){titleEl.textContent='Finanzas';content.innerHTML='<div class="grid4"><div class="card kpi"><small>Ventas</small><strong>$24,580</strong></div><div class="card kpi"><small>Costos</small><strong>$14,340</strong></div><div class="card kpi"><small>Ganancia</small><strong>$10,240</strong></div><div class="card kpi"><small>Margen</small><strong>41.7%</strong></div></div><div class="card"><h3>Rentabilidad real</h3><p class="muted">Los costos salen de inventario → recetas → consumo por medida → venta.</p></div>'},
plan(){titleEl.textContent='Mi plan';content.innerHTML='<div class="plan-grid"><div class="card plan"><h3>Emprende</h3><div class="pricebig">$249<small>/mes</small></div><p>Productos, cotizaciones e inventario básico.</p></div><div class="card plan current"><h3>Negocio</h3><div class="pricebig">$449<small>/mes</small></div><p>Recetas, costos, producción y rentabilidad.</p></div><div class="card plan"><h3>Pro</h3><div class="pricebig">$699<small>/mes</small></div><p>Varias marcas, usuarios e integraciones.</p></div></div>'}
};
show('home');
</script>
</body>
</html>
