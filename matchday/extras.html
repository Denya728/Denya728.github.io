<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATCHDAY · Más</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#fbf7f4;--card:#fffdfa;--ink:#302426;--muted:#8c7478;--rose:#efd0d1;--cherry:#a94652;--deep:#7e303c;--line:#eadfdd}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}.app{max-width:480px;margin:auto;padding:22px 18px 70px}.brand,h1,h2{font-family:Georgia,serif}.brand{color:var(--cherry);font-weight:900;letter-spacing:.09em}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:17px;margin:12px 0}.hero{background:linear-gradient(145deg,#fff8f5,#f2d8d9)}.k{font-size:10px;font-weight:900;color:var(--cherry);letter-spacing:.13em}.mini{font-size:12px;color:var(--muted);line-height:1.5}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:white;margin:6px 0}.btn{width:100%;padding:12px;border:0;border-radius:15px;background:var(--cherry);color:white;font-weight:800;margin-top:7px}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.item{padding:10px 0;border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{display:flex;gap:6px;flex-wrap:wrap}.status button{border:1px solid var(--line);background:white;border-radius:99px;padding:8px;font-size:11px}</style></head><body><div class="app"><div class="brand">MATCHDAY</div><h1>Más de nosotros ❤️</h1><div class="card hero"><div class="k">ALGÚN DÍA ✨</div><h2>Wishlist</h2><input id="wish" class="field" placeholder="Ej. Ir a un autocinema"><button class="btn" onclick="addWish()">Guardar idea</button><div id="wishes"></div></div><div class="card"><div class="k">RETOS DE PAREJA 🎯</div><h2>Challenges</h2><select id="challenge" class="field"><option>ABC Dates</option><option>Cita de $100</option><option>Recrear nuestra primera cita</option><option>Cita sin celulares</option><option>Probar algo nuevo</option><option>Cocinar juntos</option></select><button class="btn" onclick="addChallenge()">Agregar reto</button><div id="challenges"></div></div><div class="card"><div class="k">FECHAS ESPECIALES 🎂</div><h2>Nuestras fechas</h2><input id="specialTitle" class="field" placeholder="Cumpleaños de…"><input id="specialDate" class="field" type="date"><button class="btn" onclick="addSpecial()">Guardar fecha especial</button><div id="specials"></div></div><div class="card hero"><div class="k">YA VOY EN CAMINO ❤️</div><h2>¿Cómo vas?</h2><div class="status"><button onclick="trip('leaving')">🚪 Saliendo</button><button onclick="trip('on_way')">🚗 En camino</button><button onclick="trip('almost')">👀 Casi llego</button><button onclick="trip('arrived')">❤️ Ya llegué</button></div><input id="eta" class="field" type="number" min="1" placeholder="ETA aproximado en minutos"><button class="btn" onclick="shareTrip()">Compartir ubicación temporal</button><button class="btn ghost" onclick="trip('ended')">Terminar trayecto</button><div class="mini" id="tripMsg">La ubicación solo se comparte cuando tú la activas y se detiene al terminar.</div></div><button class="btn ghost" onclick="location.href='./'">← Volver a Inicio</button></div><script>const sb=supabase.createClient('https://eyyzeeqvaajkrpwquaui.supabase.co','sb_publishable_5g1TEdIr5-npVpU-0HY7Rw_GFk1TEFy'),$=x=>document.getElementById(x);let me,cid;async function init(){let{data:{session}}=await sb.auth.getSession();if(!session)return location.href='./';me=session.user;let{data:m}=await sb.from('couple_members').select('couple_id').eq('user_id',me.id).maybeSingle();if(!m)return;cid=m.couple_id;load()}async function load(){let [w,c,s,t]=await Promise.all([sb.from('couple_wishlist').select('*').eq('couple_id',cid).order('created_at',{ascending:false}),sb.from('couple_challenges').select('*').eq('couple_id',cid).order('created_at',{ascending:false}),sb.from('special_dates').select('*').eq('couple_id',cid).order('event_date'),sb.from('trip_status').select('*').eq('couple_id',cid)]);$('wishes').innerHTML=(w.data||[]).map(x=>`<div class="item">${x.status==='done'?'✅':'♡'} ${e(x.title)} <button onclick="doneWish('${x.id}')">✓</button></div>`).join('');$('challenges').innerHTML=(c.data||[]).map(x=>`<div class="item">${x.status==='done'?'🏆':'🎯'} ${e(x.title)} <button onclick="doneChallenge('${x.id}')">✓</button></div>`).join('');$('specials').innerHTML=(s.data||[]).map(x=>`<div class="item">🎂 <b>${e(x.title)}</b><div class="mini">${new Date(x.event_date+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'long'})} · cada año</div></div>`).join('');let p=(t.data||[]).find(x=>x.user_id!==me.id&&x.sharing);if(p)$('tripMsg').textContent=`Tu persona: ${p.status.replace('_',' ')}${p.eta_minutes?' · ~'+p.eta_minutes+' min':''}`};function e(s=''){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function addWish(){let v=$('wish').value.trim();if(!v)return;await sb.from('couple_wishlist').insert({couple_id:cid,created_by:me.id,title:v});$('wish').value='';load()}async function doneWish(id){await sb.from('couple_wishlist').update({status:'done'}).eq('id',id);load()}async function addChallenge(){await sb.from('couple_challenges').insert({couple_id:cid,created_by:me.id,title:$('challenge').value});load()}async function doneChallenge(id){await sb.from('couple_challenges').update({status:'done',completed_at:new Date().toISOString()}).eq('id',id);load()}async function addSpecial(){let t=$('specialTitle').value.trim(),d=$('specialDate').value;if(!t||!d)return;await sb.from('special_dates').insert({couple_id:cid,created_by:me.id,title:t,event_date:d});$('specialTitle').value='';load()}async function trip(status,geo=null){let ended=status==='ended',row={couple_id:cid,user_id:me.id,status,eta_minutes:+$('eta').value||null,sharing:!ended,updated_at:new Date().toISOString()};if(geo){row.latitude=geo.coords.latitude;row.longitude=geo.coords.longitude}await sb.from('trip_status').upsert(row,{onConflict:'couple_id,user_id'});$('tripMsg').textContent=ended?'Trayecto terminado. Ubicación apagada ♡':'Estado compartido ❤️';load()}function shareTrip(){if(!navigator.geolocation)return $('tripMsg').textContent='Este dispositivo no permite ubicación.';navigator.geolocation.getCurrentPosition(p=>trip('on_way',p),()=>{$('tripMsg').textContent='No se pudo acceder a tu ubicación. Puedes compartir solo el estado.'},{enableHighAccuracy:false,timeout:10000})}init();</script></body></html>
