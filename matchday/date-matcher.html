<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATCHDAY · Date Matcher</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#fbf7f4;--card:#fffdfa;--ink:#302426;--muted:#8c7478;--rose:#efd0d1;--cherry:#a94652;--deep:#7e303c;--line:#eadfdd;--cream:#f6eee8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}.app{max-width:480px;margin:auto;padding:22px 18px 70px}.brand,h1,.big,.section{font-family:Georgia,serif}.brand{color:var(--cherry);font-weight:900}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0}.k{font-size:10px;font-weight:900;color:var(--cherry);letter-spacing:.13em}.big{font-size:22px;color:var(--deep)}.mini{font-size:12px;color:var(--muted);line-height:1.5}.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;background:var(--cherry);color:white;margin-top:10px}.ghost,.danger{background:white;color:var(--ink);border:1px solid var(--line)}.danger{color:var(--cherry)}.dateOption,.plan,.savedDate{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:18px;padding:13px;margin:8px 0}.dateOption.selected,.plan.selected{border:2px solid var(--cherry);background:#fff4f3}.section{font-size:20px;color:var(--deep);margin:20px 2px 8px}.pill{display:inline-block;background:var(--cream);border-radius:99px;padding:6px 9px;font-size:11px;margin:3px}</style></head><body><div class="app"><div class="brand">MATCHDAY</div><h1>Date Matcher ✦</h1><div id="status" class="card"><div class="big">Buscando tiempo real juntos…</div></div><div id="dateChoices"></div><div id="result"></div><button class="btn" id="save" style="display:none">Guardar este Match ❤️</button><div id="savedMsg"></div><div class="section">Sus citas guardadas ❤️</div><div id="savedDates" class="card"></div><button class="btn" id="match">Buscar otras opciones ❤️</button><button class="btn ghost" onclick="location.href='./'">← Volver</button></div><script>const sb=supabase.createClient('https://eyyzeeqvaajkrpwquaui.supabase.co','sb_publishable_5g1TEdIr5-npVpU-0HY7Rw_GFk1TEFy'),$=x=>document.getElementById(x);let me,couple,partner,profiles={},prefs=[],schedules=[],energy=[],events=[],slots=[],selected=0,selectedPlan,currentBudget,savedMatches=[];const mins=t=>{let[a,b]=t.slice(0,5).split(':').map(Number);return a*60+b},fmt=n=>`${Math.floor(n/60)%12||12}:${String(n%60).padStart(2,'0')} ${n<720?'AM':'PM'}`,sqlDate=d=>d.toLocaleDateString('en-CA'),sqlTime=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}:00`;function busyFor(d,u){let a=schedules.filter(s=>s.user_id===u&&+s.day_of_week===d.getDay()).map(s=>[mins(s.start_time),mins(s.end_time)]);events.filter(e=>e.event_date===sqlDate(d)&&(e.created_by===u||!e.created_by)).forEach(e=>a.push([e.start_time?mins(e.start_time):540,e.end_time?mins(e.end_time):1320]));return a.sort((x,y)=>x[0]-y[0])}function free(d,u){let busy=busyFor(d,u),merged=[];busy.forEach(x=>{let z=merged.at(-1);z&&x[0]<=z[1]?z[1]=Math.max(z[1],x[1]):merged.push([...x])});let out=[],c=540;merged.forEach(([a,b])=>{if(a>c)out.push([c,Math.min(a,1320)]);c=Math.max(c,b)});if(c<1320)out.push([c,1320]);return out.filter(x=>x[1]-x[0]>=60)}function allSlots(){let now=new Date,out=[];for(let i=0;i<30&&out.length<8;i++){let d=new Date(now);d.setDate(now.getDate()+i);let A=free(d,me.id),B=free(d,partner);A.forEach(a=>B.forEach(b=>{let s=Math.max(a[0],b[0]),e=Math.min(a[1],b[1]);if(e-s>=60&&!(i===0&&e<=now.getHours()*60+now.getMinutes()))out.push({d:new Date(d),slot:[s,e]})}))}return out.slice(0,8)}const ideas={'🍝 Comer':['Cena casual juntos','Ir por su comida favorita'],'🎬 Cine':['Cine + snack compartido','Noche de película en casa'],'☕ Cafecito':['Cafecito + caminata','Ruta de postre y café'],'🌳 Naturaleza':['Picnic tranquilo','Paseo al aire libre'],'🎮 Juegos':['Noche de juegos','Arcade + snack'],'🎨 Talleres':['Taller creativo juntos','Pintar algo juntos'],'🏠 En casa':['Cena hecha juntos + peli','Noche sin celulares'],'✈️ Viajes':['Mini roadtrip sorpresa','Planear una escapada'],'🎤 Eventos':['Música en vivo','Noche de karaoke'],'🥾 Senderismo':['Caminata + desayuno','Ruta al atardecer'],'🎳 Boliche':['Boliche + apuesta divertida','Boliche + postre'],'📸 Fotos':['Photo date','Paseo para fotos']};function br(b){return b?.includes('0–100')?0:b?.includes('100–300')?1:b?.includes('300–600')?2:3}function label(x){return x.d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}function renderDates(){$('dateChoices').innerHTML='<div class="section">¿Qué día les late? ♡</div>'+slots.map((x,i)=>`<button class="dateOption ${i===selected?'selected':''}" data-i="${i}"><b>${label(x)}</b><div class="mini">${fmt(x.slot[0])}–${fmt(x.slot[1])}</div></button>`).join('');document.querySelectorAll('.dateOption').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;renderDates();renderPlan()})}function renderPlan(){let x=slots[selected],mine=prefs.filter(p=>p.user_id===me.id&&['love','like','try'].includes(p.state)),theirs=prefs.filter(p=>p.user_id===partner&&['love','like','try'].includes(p.state)),bad=new Set(prefs.filter(p=>p.state==='no').map(p=>p.item)),pool=mine.map(p=>p.item).filter(i=>theirs.some(q=>q.item===i)&&!bad.has(i));if(!pool.length)pool=mine.map(p=>p.item).filter(i=>!bad.has(i));if(!pool.length)pool=['🏠 En casa','☕ Cafecito'];currentBudget=[profiles[me.id]?.budget,profiles[partner]?.budget].sort((a,b)=>br(a)-br(b))[0]||'$0–100';let calm=energy.some(e=>['yellow','red'].includes(e.level)),plans=pool.slice(0,3).map(item=>({item,emoji:item.split(' ')[0],title:(ideas[item]||['Tiempo juntos'])[calm?1:0]||'Tiempo juntos'}));selectedPlan=plans[0];$('status').innerHTML=`<div class="k">MATCH SELECCIONADO ❤️</div><div class="big">${label(x)}</div><div class="mini">${fmt(x.slot[0])}–${fmt(x.slot[1])}</div><span class="pill">💸 ${currentBudget}</span>`;$('result').innerHTML='<div class="section">Planes ✦</div>'+plans.map((p,i)=>`<div class="plan ${i?'':'selected'}" data-i="${i}"><b>${p.emoji} ${p.title}</b><div class="mini">Basado en sus gustos y disponibilidad real.</div></div>`).join('');document.querySelectorAll('.plan').forEach((p,i)=>p.onclick=()=>{selectedPlan=plans[i];document.querySelectorAll('.plan').forEach(z=>z.classList.remove('selected'));p.classList.add('selected')});$('save').style.display='block'}async function loadSaved(){let{data}=await sb.from('saved_matches').select('*').eq('couple_id',couple).order('match_date');savedMatches=data||[];let a=savedMatches.filter(x=>x.status==='planned');$('savedDates').innerHTML=a.length?a.map(p=>`<div class="savedDate"><b>${p.plan_emoji||'❤️'} ${p.plan_title}</b><div class="mini">${p.match_date} · ${p.start_time?.slice(0,5)||''}</div><button class="btn danger" onclick="cancelMatch('${p.id}')">Cancelar cita</button></div>`).join(''):'<div class="mini">No tienen citas guardadas.</div>'}async function cancelMatch(id){if(!confirm('¿Cancelar esta cita?'))return;await sb.from('saved_matches').update({status:'cancelled'}).eq('id',id).eq('couple_id',couple);loadSaved()}async function saveMatch(){let x=slots[selected];if(!x||!selectedPlan)return;let{error}=await sb.from('saved_matches').insert({couple_id:couple,created_by:me.id,plan_title:selectedPlan.title,plan_emoji:selectedPlan.emoji,match_date:sqlDate(x.d),start_time:sqlTime(x.slot[0]),end_time:sqlTime(x.slot[1]),budget:currentBudget,status:'planned'});$('savedMsg').innerHTML=error?`<div class="card">${error.message}</div>`:'<div class="card"><b>IT’S A MATCH ❤️</b><div class="mini">Ya quedó guardado.</div></div>';loadSaved()}function build(){slots=allSlots();selected=0;if(!slots.length){$('status').innerHTML='<div class="big">No encontré un espacio libre 🥺</div><div class="mini">Ahora también tomo en cuenta fiestas, reuniones y otros eventos del calendario.</div>';return}renderDates();renderPlan()}async function init(){let{data:{session}}=await sb.auth.getSession();if(!session)return;me=session.user;let{data:m}=await sb.from('couple_members').select('couple_id').eq('user_id',me.id).maybeSingle();couple=m?.couple_id;if(!couple)return;let{data:members}=await sb.from('couple_members').select('user_id').eq('couple_id',couple);partner=members.find(x=>x.user_id!==me.id)?.user_id;if(!partner)return;let ids=[me.id,partner],r=await Promise.all([sb.from('profiles').select('*').in('id',ids),sb.from('preferences').select('*').in('user_id',ids),sb.from('schedules').select('*').in('user_id',ids),sb.from('energy_status').select('*').in('user_id',ids),sb.from('calendar_events').select('*').eq('couple_id',couple)]);(r[0].data||[]).forEach(x=>profiles[x.id]=x);prefs=r[1].data||[];schedules=r[2].data||[];energy=r[3].data||[];events=r[4].data||[];build();loadSaved()}$('match').onclick=build;$('save').onclick=saveMatch;init();</script></body></html>
