<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MATCHDAY · Date Matcher</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#fbf7f4;--card:#fffdfa;--ink:#302426;--muted:#8c7478;--rose:#efd0d1;--cherry:#a94652;--deep:#7e303c;--line:#eadfdd;--cream:#f6eee8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(#fbf8f6,#f5eceb);color:var(--ink)}.app{max-width:480px;min-height:100vh;margin:auto;padding:22px 18px 70px}.brand{font-family:Georgia,serif;color:var(--cherry);font-weight:900;letter-spacing:.08em}.tag{font:italic 12px Georgia;color:var(--muted)}h1{font:30px Georgia;margin:22px 0 6px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0}.k{font-size:10px;font-weight:900;color:var(--cherry);letter-spacing:.14em;text-transform:uppercase}.big{font:22px Georgia;color:var(--deep);margin:8px 0}.mini{font-size:12px;color:var(--muted);line-height:1.5}.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;background:var(--cherry);color:white;margin-top:10px;cursor:pointer}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.plan{padding:14px;border-radius:18px;background:#fff8f5;margin:10px 0;border:1px solid var(--line);cursor:pointer}.plan.selected{border:2px solid var(--cherry);background:#fff1f1}.plan b{font-family:Georgia,serif;font-size:18px}.pill{display:inline-block;background:var(--cream);border-radius:99px;padding:6px 9px;font-size:11px;margin:3px}.heart{text-align:center;font-size:42px;color:var(--cherry);margin-top:35px}.dates{display:grid;gap:9px;margin-top:12px}.dateOption{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:18px;padding:13px;color:var(--ink);cursor:pointer}.dateOption.selected{border:2px solid var(--cherry);background:#fff4f3}.dateOption strong{display:block;font-family:Georgia,serif;font-size:16px;color:var(--deep)}.section{font:20px Georgia;color:var(--deep);margin:20px 2px 8px}.success{background:#fff4f3;border:1px solid var(--rose);border-radius:18px;padding:14px;margin-top:12px;text-align:center}</style></head><body><div class="app"><div class="brand">MATCHDAY</div><div class="tag">make time for us. ♡</div><div class="heart">♥</div><h1>Date Matcher ✦</h1><div id="status" class="card"><div class="k">Preparando sus matches</div><div class="big">Leyendo su tiempo, energía y gustos…</div></div><div id="dateChoices"></div><div id="result"></div><button class="btn" id="save" style="display:none">Guardar este Match ❤️</button><div id="savedMsg"></div><button class="btn" id="match">Buscar otras opciones ❤️</button><button class="btn ghost" onclick="location.href='./'">← Volver a MATCHDAY</button></div><script>const sb=supabase.createClient('https://eyyzeeqvaajkrpwquaui.supabase.co','sb_publishable_5g1TEdIr5-npVpU-0HY7Rw_GFk1TEFy');let me,couple,partner,profiles={},prefs=[],schedules=[],energy=[],slots=[],selected=0,selectedPlan=null,currentBudget='$0–100';const $=x=>document.getElementById(x),mins=t=>{let[a,b]=t.slice(0,5).split(':').map(Number);return a*60+b},fmt=n=>`${Math.floor(n/60)%12||12}:${String(n%60).padStart(2,'0')} ${n<720?'AM':'PM'}`,sqlTime=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}:00`,sqlDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function free(day,u){let busy=schedules.filter(s=>s.user_id===u&&+s.day_of_week===day).map(s=>[mins(s.start_time),mins(s.end_time)]).sort((a,b)=>a[0]-b[0]),merged=[];busy.forEach(x=>{let z=merged.at(-1);z&&x[0]<=z[1]?z[1]=Math.max(z[1],x[1]):merged.push([...x])});let out=[],c=540;merged.forEach(([a,b])=>{if(a>c)out.push([c,Math.min(a,1320)]);c=Math.max(c,b)});if(c<1320)out.push([c,1320]);return out.filter(x=>x[1]-x[0]>=60)}function allSlots(){let now=new Date,out=[];for(let i=0;i<30&&out.length<8;i++){let d=new Date(now);d.setDate(now.getDate()+i);let A=free(d.getDay(),me.id),B=free(d.getDay(),partner),hits=[];A.forEach(a=>B.forEach(b=>{let s=Math.max(a[0],b[0]),e=Math.min(a[1],b[1]);if(e-s>=60)hits.push([s,e])}));if(i===0)hits=hits.filter(x=>x[1]>now.getHours()*60+now.getMinutes());hits.slice(0,2).forEach(slot=>out.push({d:new Date(d),slot}))}return out.slice(0,8)}const ideas={"🍝 Comer":["Cena casual juntos","Ir por su comida favorita"],"🎬 Cine":["Cine + snack compartido","Noche de película en casa"],"☕ Cafecito":["Cafecito + caminata","Ruta de postre y café"],"🌳 Naturaleza":["Picnic tranquilo","Paseo al aire libre"],"🎮 Juegos":["Noche de juegos","Arcade + snack"],"🎨 Talleres":["Taller creativo juntos","Pintar algo el uno para el otro"],"🏠 En casa":["Cena hecha juntos + peli","Noche sin celulares en casa"],"✈️ Viajes":["Mini roadtrip sorpresa","Planear su próxima escapada"],"🎤 Eventos":["Evento o música en vivo","Noche de karaoke"],"🥾 Senderismo":["Caminata + desayuno","Ruta corta al atardecer"],"🎳 Boliche":["Boliche + apuesta divertida","Boliche + postre"],"📸 Fotos":["Photo date","Paseo para tomarse fotos"]};function budgetRank(b){return b?.includes('0–100')?0:b?.includes('100–300')?1:b?.includes('300–600')?2:3}function dateLabel(x){let t=x.d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});return t.charAt(0).toUpperCase()+t.slice(1)}function renderDates(){if(!slots.length){$('dateChoices').innerHTML='';return}$('dateChoices').innerHTML='<div class="section">¿Qué día les late? ♡</div><div class="dates">'+slots.map((x,i)=>`<button class="dateOption ${i===selected?'selected':''}" data-i="${i}"><strong>${i===0?'✨ Próximo Match · ':''}${dateLabel(x)}</strong><span class="mini">${fmt(x.slot[0])}–${fmt(x.slot[1])} · ${Math.floor((x.slot[1]-x.slot[0])/60)} h ${((x.slot[1]-x.slot[0])%60)?((x.slot[1]-x.slot[0])%60)+' min':''} libres juntos</span></button>`).join('')+'</div>';document.querySelectorAll('.dateOption').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;$('savedMsg').innerHTML='';renderDates();renderPlan()})}function renderPlan(){let x=slots[selected];if(!x)return;let mine=prefs.filter(p=>p.user_id===me.id&&['love','like','try'].includes(p.state)),theirs=prefs.filter(p=>p.user_id===partner&&['love','like','try'].includes(p.state)),bad=new Set(prefs.filter(p=>p.state==='no').map(p=>p.item)),shared=mine.map(p=>p.item).filter(i=>theirs.some(q=>q.item===i)&&!bad.has(i)),pool=shared.length?shared:mine.map(p=>p.item).filter(i=>!bad.has(i));if(!pool.length)pool=['🏠 En casa','☕ Cafecito'];let b=[profiles[me.id]?.budget,profiles[partner]?.budget].sort((a,z)=>budgetRank(a)-budgetRank(z))[0]||'$0–100',e1=energy.find(e=>e.user_id===me.id)?.level,e2=energy.find(e=>e.user_id===partner)?.level,calm=e1==='red'||e2==='red'||e1==='yellow'||e2==='yellow',chosen=pool.slice(0,3),plans=chosen.map((item,i)=>{let arr=ideas[item]||['Tiempo juntos'],title=arr[calm&&arr[1]?1:0];return{item,title,emoji:item.split(' ')[0],rank:i}});currentBudget=b;selectedPlan=plans[0];$('status').innerHTML=`<div class="k">MATCH SELECCIONADO ❤️</div><div class="big">${dateLabel(x)}</div><div class="mini">${fmt(x.slot[0])}–${fmt(x.slot[1])}</div><div><span class="pill">💸 ${b}</span><span class="pill">${calm?'🌙 Plan tranquilo':'✨ Con energía'}</span></div>`;$('result').innerHTML='<div class="section">Planes para este Match ✦</div>'+plans.map((p,i)=>`<div class="plan ${i===0?'selected':''}" data-i="${i}"><div class="k">${i===0?'MEJOR MATCH':'ALTERNATIVA '+(i+1)}</div><b>${p.title}</b><div class="mini">Basado en ${p.item.replace(/^\S+\s/,'')}, su tiempo libre y el presupuesto más cómodo para ambos.</div></div>`).join('');document.querySelectorAll('.plan').forEach((el,i)=>el.onclick=()=>{selectedPlan=plans[i];document.querySelectorAll('.plan').forEach(p=>p.classList.remove('selected'));el.classList.add('selected')});$('save').style.display='block'}async function saveMatch(){let x=slots[selected];if(!x||!selectedPlan)return;let btn=$('save');btn.disabled=true;btn.textContent='Guardando su Match…';let row={couple_id:couple,created_by:me.id,plan_title:selectedPlan.title,plan_emoji:selectedPlan.emoji,match_date:sqlDate(x.d),start_time:sqlTime(x.slot[0]),end_time:sqlTime(x.slot[1]),budget:currentBudget,status:'planeada',note:null};let{error}=await sb.from('saved_matches').insert(row);btn.disabled=false;btn.textContent='Guardar este Match ❤️';if(error){$('savedMsg').innerHTML=`<div class="success">No pude guardarlo: ${error.message}</div>`;return}$('savedMsg').innerHTML=`<div class="success"><b>IT'S A MATCH ❤️</b><br>${selectedPlan.title}<br><span class="mini">Ya quedó guardado en su calendario.</span><button class="btn ghost" onclick="location.href='./'">Ver en MATCHDAY</button></div>`}function build(){slots=allSlots();selected=0;$('savedMsg').innerHTML='';if(!slots.length){$('status').innerHTML='<div class="big">Todavía no encuentro un Match Time 🥺</div><div class="mini">Agreguen sus horarios semanales en Inicio y vuelvan a intentar.</div>';$('dateChoices').innerHTML='';$('result').innerHTML='';$('save').style.display='none';return}renderDates();renderPlan()}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){$('status').innerHTML='<div class="big">Primero entra a MATCHDAY ❤️</div>';return}me=session.user;let{data:m}=await sb.from('couple_members').select('couple_id').eq('user_id',me.id).maybeSingle();if(!m){$('status').innerHTML='<div class="big">Aún no estás vinculado 💌</div>';return}couple=m.couple_id;let{data:members}=await sb.from('couple_members').select('user_id').eq('couple_id',couple);partner=members.find(x=>x.user_id!==me.id)?.user_id;if(!partner){$('status').innerHTML='<div class="big">Esperando a tu persona 💌</div>';return}let ids=[me.id,partner],r=await Promise.all([sb.from('profiles').select('*').in('id',ids),sb.from('preferences').select('*').in('user_id',ids),sb.from('schedules').select('*').in('user_id',ids),sb.from('energy_status').select('*').in('user_id',ids)]);(r[0].data||[]).forEach(p=>profiles[p.id]=p);prefs=r[1].data||[];schedules=r[2].data||[];energy=r[3].data||[];build()}$('match').onclick=build;$('save').onclick=saveMatch;init();</script></body></html>
