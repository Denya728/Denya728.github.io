<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MATCHDAY · Date Matcher</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#fbf7f4;--card:#fffdfa;--ink:#302426;--muted:#8c7478;--rose:#efd0d1;--cherry:#a94652;--line:#eadfdd;--cream:#f6eee8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(#fbf8f6,#f5eceb);color:var(--ink)}.app{max-width:480px;min-height:100vh;margin:auto;padding:22px 18px 70px}.brand{font-family:Georgia,serif;color:var(--cherry);font-weight:900;letter-spacing:.08em}.tag{font:italic 12px Georgia;color:var(--muted)}h1{font:30px Georgia;margin:22px 0 6px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0}.k{font-size:10px;font-weight:900;color:var(--cherry);letter-spacing:.14em;text-transform:uppercase}.big{font:22px Georgia;color:#7e303c;margin:8px 0}.mini{font-size:12px;color:var(--muted);line-height:1.5}.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;background:var(--cherry);color:white;margin-top:10px}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.plan{padding:14px;border-radius:18px;background:#fff8f5;margin:10px 0;border:1px solid var(--line)}.plan b{font-family:Georgia,serif;font-size:18px}.pill{display:inline-block;background:var(--cream);border-radius:99px;padding:6px 9px;font-size:11px;margin:3px}.heart{text-align:center;font-size:42px;color:var(--cherry);margin-top:35px}</style></head><body><div class="app"><div class="brand">MATCHDAY</div><div class="tag">make time for us. ♡</div><div class="heart">♥</div><h1>Date Matcher ✦</h1><div id="status" class="card"><div class="k">Preparando su match</div><div class="big">Leyendo su tiempo, energía y gustos…</div></div><div id="result"></div><button class="btn" id="match">Encontrar nuestra cita ❤️</button><button class="btn ghost" onclick="location.href='./'">← Volver a MATCHDAY</button></div><script>const sb=supabase.createClient('https://eyyzeeqvaajkrpwquaui.supabase.co','sb_publishable_5g1TEdIr5-npVpU-0HY7Rw_GFk1TEFy');let me,couple,partner,profiles={},prefs=[],schedules=[],energy=[];const $=x=>document.getElementById(x),mins=t=>{let[a,b]=t.slice(0,5).split(':').map(Number);return a*60+b},fmt=n=>`${Math.floor(n/60)%12||12}:${String(n%60).padStart(2,'0')} ${n<720?'AM':'PM'}`;function free(day,u){let busy=schedules.filter(s=>s.user_id===u&&+s.day_of_week===day).map(s=>[mins(s.start_time),mins(s.end_time)]).sort((a,b)=>a[0]-b[0]),merged=[];busy.forEach(x=>{let z=merged.at(-1);z&&x[0]<=z[1]?z[1]=Math.max(z[1],x[1]):merged.push([...x])});let out=[],c=540;merged.forEach(([a,b])=>{if(a>c)out.push([c,Math.min(a,1320)]);c=Math.max(c,b)});if(c<1320)out.push([c,1320]);return out.filter(x=>x[1]-x[0]>=60)}function nextSlot(){let now=new Date;for(let i=0;i<14;i++){let d=new Date(now);d.setDate(now.getDate()+i);let A=free(d.getDay(),me.id),B=free(d.getDay(),partner),hits=[];A.forEach(a=>B.forEach(b=>{let s=Math.max(a[0],b[0]),e=Math.min(a[1],b[1]);if(e-s>=60)hits.push([s,e])}));if(i===0)hits=hits.filter(x=>x[1]>now.getHours()*60+now.getMinutes());if(hits.length)return{d,slot:hits[0]}}}const ideas={"🍝 Comer":["Cena casual juntos","Ir por su comida favorita"],"🎬 Cine":["Cine + snack compartido","Noche de película en casa"],"☕ Cafecito":["Cafecito + caminata","Ruta de postre y café"],"🌳 Naturaleza":["Picnic tranquilo","Paseo al aire libre"],"🎮 Juegos":["Noche de juegos","Arcade + snack"],"🎨 Talleres":["Taller creativo juntos","Pintar algo el uno para el otro"],"🏠 En casa":["Cena hecha juntos + peli","Noche sin celulares en casa"],"✈️ Viajes":["Mini roadtrip sorpresa","Planear su próxima escapada"],"🎤 Eventos":["Evento o música en vivo","Noche de karaoke"],"🥾 Senderismo":["Caminata + desayuno","Ruta corta al atardecer"],"🎳 Boliche":["Boliche + apuesta divertida","Boliche + postre"],"📸 Fotos":["Photo date","Paseo para tomarse fotos"]};function budgetRank(b){return b?.includes('0–100')?0:b?.includes('100–300')?1:b?.includes('300–600')?2:3}function build(){let x=nextSlot();if(!x){$('result').innerHTML='<div class="card"><div class="big">Todavía no encuentro un Match Time 🥺</div><div class="mini">Agreguen sus horarios semanales en Inicio y vuelvan a intentar.</div></div>';return}let mine=prefs.filter(p=>p.user_id===me.id&&['love','like','try'].includes(p.state)),theirs=prefs.filter(p=>p.user_id===partner&&['love','like','try'].includes(p.state)),bad=new Set(prefs.filter(p=>p.state==='no').map(p=>p.item)),shared=mine.map(p=>p.item).filter(i=>theirs.some(q=>q.item===i)&&!bad.has(i));let pool=shared.length?shared:mine.map(p=>p.item).filter(i=>!bad.has(i));if(!pool.length)pool=['🏠 En casa','☕ Cafecito'];let b=[profiles[me.id]?.budget,profiles[partner]?.budget].sort((a,z)=>budgetRank(a)-budgetRank(z))[0]||'$0–100',e1=energy.find(e=>e.user_id===me.id)?.level,e2=energy.find(e=>e.user_id===partner)?.level,calm=e1==='red'||e2==='red'||e1==='yellow'||e2==='yellow';let chosen=pool.slice(0,3),date=x.d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});$('status').innerHTML=`<div class="k">MATCH ENCONTRADO ❤️</div><div class="big">${date.charAt(0).toUpperCase()+date.slice(1)}</div><div class="mini">${fmt(x.slot[0])}–${fmt(x.slot[1])} · ${Math.floor((x.slot[1]-x.slot[0])/60)} h juntos</div><div><span class="pill">💸 ${b}</span><span class="pill">${calm?'🌙 Plan tranquilo':'✨ Con energía'}</span></div>`;$('result').innerHTML=chosen.map((item,i)=>{let arr=ideas[item]||['Tiempo juntos'];let title=arr[calm&&arr[1]?1:0];return `<div class="plan"><div class="k">${i===0?'MEJOR MATCH':'ALTERNATIVA '+(i+1)}</div><b>${title}</b><div class="mini">Basado en ${item.replace(/^\S+\s/,'')}, su tiempo libre y el presupuesto más cómodo para ambos.</div></div>`}).join('')}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){$('status').innerHTML='<div class="big">Primero entra a MATCHDAY ❤️</div>';return}me=session.user;let{data:m}=await sb.from('couple_members').select('couple_id').eq('user_id',me.id).maybeSingle();if(!m){$('status').innerHTML='<div class="big">Aún no estás vinculado 💌</div>';return}couple=m.couple_id;let{data:members}=await sb.from('couple_members').select('user_id').eq('couple_id',couple);partner=members.find(x=>x.user_id!==me.id)?.user_id;if(!partner){$('status').innerHTML='<div class="big">Esperando a tu persona 💌</div>';return}let ids=[me.id,partner],r=await Promise.all([sb.from('profiles').select('*').in('id',ids),sb.from('preferences').select('*').in('user_id',ids),sb.from('schedules').select('*').in('user_id',ids),sb.from('energy_status').select('*').in('user_id',ids)]);(r[0].data||[]).forEach(p=>profiles[p.id]=p);prefs=r[1].data||[];schedules=r[2].data||[];energy=r[3].data||[];build()}$('match').onclick=build;init();</script></body></html>
