<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MATCHDAY · Evento</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#fbf7f4;--card:#fffdfa;--ink:#302426;--muted:#8c7478;--rose:#efd0d1;--cherry:#a94652;--deep:#7e303c;--line:#eadfdd;--cream:#f6eee8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(#fbf8f6,#f5eceb);color:var(--ink)}.app{max-width:480px;min-height:100vh;margin:auto;padding:22px 18px 70px}.brand{font-family:Georgia,serif;color:var(--cherry);font-weight:900;letter-spacing:.09em}.tag{font:italic 11px Georgia;color:var(--muted)}h1{font:30px Georgia;margin:24px 0 6px}.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin:12px 0}.field{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:white;margin:6px 0 11px;font:inherit}.label{font-weight:800;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:16px;padding:13px;font-weight:800;background:var(--cherry);color:white}.ghost{background:white;color:var(--ink);border:1px solid var(--line);margin-top:10px}.mini{font-size:12px;color:var(--muted);line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 11px}.chip.sel{background:var(--rose);color:var(--deep);font-weight:800}</style></head><body><div class="app"><div class="brand">MATCHDAY</div><div class="tag">make time for us. ♡</div><h1>Agregar evento 📅</h1><div class="mini">Para cosas de la vida real: fiesta de prima, pool party, cumpleaños, cena familiar, concierto, etc.</div><div class="card"><div class="label">¿Qué es?</div><input class="field" id="title" placeholder="Ej. Pool party de Julieta"><div class="label">Fecha</div><input class="field" id="date" type="date"><div class="label">Tipo</div><div class="chips" id="types"><button class="chip sel" data-v="social">🎉 Social</button><button class="chip" data-v="family">👨‍👩‍👧 Familia</button><button class="chip" data-v="party">🥳 Fiesta</button><button class="chip" data-v="important">⭐ Importante</button><button class="chip" data-v="other">📌 Otro</button></div><div class="row"><div><div class="label">Hora inicio</div><input class="field" id="start" type="time"></div><div><div class="label">Hora fin</div><input class="field" id="end" type="time"></div></div><div class="label">Nota</div><textarea class="field" id="note" rows="3" placeholder="Dirección, qué llevar, quién invita…"></textarea><button class="btn" id="save">Guardar en calendario ❤️</button><div class="mini" id="msg" style="margin-top:10px"></div></div><button class="btn ghost" onclick="location.href='./'">← Volver a Inicio</button></div><script>const sb=supabase.createClient('https://eyyzeeqvaajkrpwquaui.supabase.co','sb_publishable_5g1TEdIr5-npVpU-0HY7Rw_GFk1TEFy'),$=id=>document.getElementById(id);let me,cid,type='social';document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');type=b.dataset.v});async function init(){let{data:{session}}=await sb.auth.getSession();if(!session)return location.href='./';me=session.user;let{data:m}=await sb.from('couple_members').select('couple_id').eq('user_id',me.id).maybeSingle();if(!m)return;cid=m.couple_id;let q=new URLSearchParams(location.search).get('date');$('date').value=q||new Date().toLocaleDateString('en-CA')}$('save').onclick=async()=>{let title=$('title').value.trim(),date=$('date').value;if(!title||!date)return $('msg').textContent='Ponle nombre y fecha al evento ♡';$('save').disabled=true;let{error}=await sb.from('calendar_events').insert({couple_id:cid,created_by:me.id,event_date:date,title,event_type:type,start_time:$('start').value||null,end_time:$('end').value||null,note:$('note').value.trim()||null});$('save').disabled=false;if(error)return $('msg').textContent=error.message;$('msg').textContent='Guardado ❤️';setTimeout(()=>location.href='./',500)};init();</script></body></html>
