<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MATCHDAY · Evento</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#fbf7f4;--card:#fffdfa;--ink:#302426;--muted:#8c7478;--rose:#efd0d1;--cherry:#a94652;--deep:#7e303c;--line:#eadfdd}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}.app{max-width:480px;margin:auto;padding:22px 18px 70px}.brand,h1{font-family:Georgia,serif}.brand{color:var(--cherry);font-weight:900}.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin:12px 0}.field{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:white;margin:6px 0 11px}.label{font-weight:800;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:16px;padding:13px;font-weight:800;background:var(--cherry);color:white}.ghost{background:white;color:var(--ink);border:1px solid var(--line);margin-top:10px}.mini{font-size:12px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:9px}.chip.sel{background:var(--rose);font-weight:800}</style></head><body><div class="app"><div class="brand">MATCHDAY</div><h1 id="heading">Agregar evento 📅</h1><div class="mini">Fiestas, cumpleaños, reuniones, conciertos y cualquier compromiso real.</div><div class="card"><div class="label">¿Qué es?</div><input class="field" id="title" placeholder="Ej. Pool party de Julieta"><div class="label">Fecha</div><input class="field" id="date" type="date"><div class="chips"><button class="chip sel" data-v="social">🎉 Social</button><button class="chip" data-v="family">👨‍👩‍👧 Familia</button><button class="chip" data-v="party">🥳 Fiesta</button><button class="chip" data-v="important">⭐ Importante</button><button class="chip" data-v="other">📌 Otro</button></div><div class="row"><input class="field" id="start" type="time"><input class="field" id="end" type="time"></div><textarea class="field" id="note" rows="3" placeholder="Dirección, qué llevar, etc."></textarea><button class="btn" id="save">Guardar en calendario ❤️</button><div class="mini" id="msg"></div></div><button class="btn ghost" onclick="location.href='./'">← Volver</button></div><script>const sb=supabase.createClient('https://eyyzeeqvaajkrpwquaui.supabase.co','sb_publishable_5g1TEdIr5-npVpU-0HY7Rw_GFk1TEFy'),$=x=>document.getElementById(x);let me,cid,type='social',editId=new URLSearchParams(location.search).get('id');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');type=b.dataset.v});async function init(){let{data:{session}}=await sb.auth.getSession();if(!session)return location.href='./';me=session.user;let{data:m}=await sb.from('couple_members').select('couple_id').eq('user_id',me.id).maybeSingle();if(!m)return;cid=m.couple_id;$('date').value=new URLSearchParams(location.search).get('date')||new Date().toLocaleDateString('en-CA');if(editId){let{data:x}=await sb.from('calendar_events').select('*').eq('id',editId).eq('couple_id',cid).maybeSingle();if(x){$('heading').textContent='Editar evento ✏️';$('title').value=x.title;$('date').value=x.event_date;$('start').value=x.start_time?.slice(0,5)||'';$('end').value=x.end_time?.slice(0,5)||'';$('note').value=x.note||'';type=x.event_type;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('sel',b.dataset.v===type))}}}$('save').onclick=async()=>{let row={event_date:$('date').value,title:$('title').value.trim(),event_type:type,start_time:$('start').value||null,end_time:$('end').value||null,note:$('note').value.trim()||null};if(!row.title||!row.event_date)return $('msg').textContent='Ponle nombre y fecha ♡';let q=editId?sb.from('calendar_events').update(row).eq('id',editId).eq('couple_id',cid):sb.from('calendar_events').insert({...row,couple_id:cid,created_by:me.id}),{error}=await q;if(error)return $('msg').textContent=error.message;$('msg').textContent=editId?'Evento actualizado ❤️':'Guardado ❤️';setTimeout(()=>location.href='./',450)};init();</script></body></html>
