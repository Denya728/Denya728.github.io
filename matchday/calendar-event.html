v><div>D</div></div><div class="calendar" id="calendar"></div><div class="legend"><span class="lbusy">Horario</span><span class="levent">Evento</span><span class="ldate">Cita</span><span class="lspecial">Especial</span><span class="lmemory">Recuerdo</span><span>♡ Match Time</span></div></div><div id="detail" class="card detail" style="display:none"></div><div class="card"><div class="k">AGREGAR EVENTO</div><input id="title" class="field" placeholder="Ej. Pool party de Julieta"><input id="date" class="field" type="date"><div class="chips"><button class="chip sel" data-v="social">🎉 Social</button><button class="chip" data-v="family">👨‍👩‍👧 Familia</button><button class="chip" data-v="party">🥳 Fiesta</button><button class="chip" data-v="important">⭐ Importante</button><button class="chip" data-v="other">📌 Otro</button></div><div class="row"><input id="start" class="field" type="time"><input id="end" class="field" type="time"></div><textarea id="note" class="field" rows="2" placeholder="Dirección, qué llevar, etc."></textarea><button class="btn" id="save">Guardar evento ❤️</button><div id="msg" class="mini"></div></div><button class="btn ghost" onclick="location.href='./'">← Volver a MATCHDAY</button></div><script>const sb=supabase.createClient('https://eyyzeeqvaajkrpwquaui.supabase.co','sb_publishable_5g1TEdIr5-npVpU-0HY7Rw_GFk1TEFy'),$=x=>document.getElementById(x);let me,cid,partner,profiles={},schedules=[],events=[],dates=[],specials=[],memories=[],cal=new Date(),type='social',editId=null;const key=d=>d.toLocaleDateString('en-CA'),mins=t=>{let[a,b]=t.slice(0,5).split(':').map(Number);return a*60+b},fmt=n=>`${Math.floor(n/60)%12||12}:${String(n%60).padStart(2,'0')} ${n<720?'AM':'PM'}`,esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');type=b.dataset.v});function freeWindows(day,u){let busy=schedules.filter(s=>s.user_id===u&&+s.day_of_week===day).map(s=>[mins(s.start_time),mins(s.end_time)]).sort((a,b)=>a[0]-b[0]),m=[];busy.forEach(x=>{let z=m.at(-1);z&&x[0]<=z[1]?z[1]=Math.max(z[1],x[1]):m.push([...x])});let out=[],c=540;m.forEach(([a,b])=>{if(a>c)out.push([c,Math.min(a,1320)]);c=Math.max(c,b)});if(c<1320)out.push([c,1320]);return out.filter(x=>x[1]-x[0]>=60)}function matchForDay(d){if(!partner)return[];let A=freeWindows(d.getDay(),me.id),B=freeWindows(d.getDay(),partner),out=[];A.forEach(a=>B.forEach(b=>{let s=Math.max(a[0],b[0]),e=Math.min(a[1],b[1]);if(e-s>=60)out.push([s,e])}));let ev=events.filter(x=>x.event_date===key(d));return out.filter(slot=>!ev.some(x=>{let a=x.start_time?mins(x.start_time):540,b=x.end_time?mins(x.end_time):1320;return Math.max(slot[0],a)<Math.min(slot[1],b)}))}function render(){let y=cal.getFullYear(),m=cal.getMonth();$('monthTitle').textContent=new Date(y,m,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});let first=new Date(y,m,1),off=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),today=key(new Date()),html='';for(let i=0;i<42;i++){let n=i-off+1,d=new Date(y,m,n),out=n<1||n>last,ds=key(d),flags=[];if(!out&&schedules.some(s=>+s.day_of_week===d.getDay()))flags.push('busy');if(!out&&events.some(x=>x.event_date===ds))flags.push('event');if(!out&&dates.some(x=>x.match_date===ds&&x.status!=='cancelled'))flags.push('date');if(!out&&specials.some(x=>specialOccurs(x,d)))flags.push('special');if(!out&&memories.some(x=>x.memory_date===ds))flags.push('memory');let match=!out&&matchForDay(d).length;html+=`<button class="day ${out?'out':''} ${ds===today?'today':''}" ${out?'disabled':''} data-date="${ds}">${d.getDate()}${match?'<span class="match">♡</span>':''}<span class="dots">${[...new Set(flags)].map(f=>`<i class="dot ${f}"></i>`).join('')}</span></button>`}$('calendar').innerHTML=html;document.querySelectorAll('.day:not(.out)').forEach(b=>b.onclick=()=>showDay(b.dataset.date))}function specialOccurs(x,d){let e=new Date(x.event_date+'T12:00:00');return x.repeats_yearly?e.getMonth()===d.getMonth()&&e.getDate()===d.getDate():x.event_date===key(d)}function showDay(ds){let d=new Date(ds+'T12:00:00'),dow=d.getDay(),mine=schedules.filter(x=>x.user_id===me.id&&+x.day_of_week===dow),theirs=schedules.filter(x=>x.user_id===partner&&+x.day_of_week===dow),ev=events.filter(x=>x.event_date===ds),sm=dates.filter(x=>x.match_date===ds&&x.status!=='cancelled'),sp=specials.filter(x=>specialOccurs(x,d)),mem=memories.filter(x=>x.memory_date===ds),match=matchForDay(d),name=u=>profiles[u]?.name||'Persona',sched=a=>a.length?a.map(x=>`${esc(x.title)} · ${x.start_time.slice(0,5)}–${x.end_time.slice(0,5)}`).join('<br>'):'Libre ✨';$('detail').style.display='block';$('detail').innerHTML=`<div class="k">NUESTRO DÍA</div><div class="dayTitle">${d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})} ♡</div><div class="entry"><b>${esc(name(me))}</b><div class="mini">${sched(mine)}</div></div><div class="entry"><b>${esc(name(partner))}</b><div class="mini">${sched(theirs)}</div></div><div class="entry"><b>♡ Match Time</b><div class="mini">${match.length?match.map(x=>fmt(x[0])+'–'+fmt(x[1])).join(', '):'Sin coincidencia libre de 1 hora'}</div></div>${sm.map(x=>`<div class="entry"><b>❤️ ${esc(x.plan_title)}</b><div class="mini">${x.start_time?.slice(0,5)||''}${x.end_time?'–'+x.end_time.slice(0,5):''}${x.challenge_key?' · 🎯 Challenge':''}</div></div>`).join('')}${ev.map(x=>`<div class="entry"><b>🎉 ${esc(x.title)}</b><div class="mini">${x.start_time?.slice(0,5)||'Todo el día'}${x.end_time?'–'+x.end_time.slice(0,5):''}${x.note?' · '+esc(x.note):''}</div><div class="actions"><button onclick="editEvent('${x.id}')">✏️ Editar</button><button onclick="deleteEvent('${x.id}')">🗑️ Eliminar</button></div></div>`).join('')}${sp.map(x=>`<div class="entry"><b>🎂 ${esc(x.title)}</b><div class="mini">Fecha especial${x.repeats_yearly?' · cada año':''}</div></div>`).join('') ll([sb.from('profiles').select('id,name').in('id',ids),sb.from('schedules').select('*').in('user_id',ids),sb.from('calendar_events').select('*').eq('couple_id',cid),sb.from('saved_matches').select('*').eq('couple_id',cid),sb.from('special_dates').select('*').eq('couple_id',cid),sb.from('match_memories').select('id,title,memory_date').eq('couple_id',cid)]);(r[0].data||[]).forEach(x=>profiles[x.id]=x);schedules=r[1].data||[];events=r[2].data||[];dates=r[3].data||[];specials=r[4].data||[];memories=r[5].data||[];render()}async function init(){let{data:{session}}=await sb.auth.getSession();if(!session)return location.href='./';me=session.user;let{data:m}=await sb.from('couple_members').select('couple_id').eq('user_id',me.id).maybeSingle();if(!m)return;cid=m.couple_id;let{data:members}=await sb.from('couple_members').select('user_id').eq('couple_id',cid);partner=(members||[]).find(x=>x.user_id!==me.id)?.user_id||null;$('date').value=new URLSearchParams(location.search).get('date')||key(new Date());await load()}$('prev').onclick=()=>{cal.setMonth(cal.getMonth()-1);render()};$('next').onclick=()=>{cal.setMonth(cal.getMonth()+1);render()};init();</script></body></html>
