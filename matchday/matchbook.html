<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MATCHDAY · Matchbook</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#fbf7f4;--card:#fffdfa;--ink:#302426;--muted:#8c7478;--rose:#efd0d1;--cherry:#a94652;--deep:#7e303c;--line:#eadfdd;--cream:#f6eee8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(#fbf8f6,#f5eceb);color:var(--ink)}.app{max-width:480px;min-height:100vh;margin:auto;padding:22px 18px 70px}.brand{font-family:Georgia,serif;color:var(--cherry);font-weight:900;letter-spacing:.09em}.tag{font:italic 11px Georgia;color:var(--muted)}h1{font:32px Georgia;margin:24px 0 5px}.card{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:17px;margin:12px 0;box-shadow:0 8px 24px rgba(85,50,54,.04)}.hero{background:linear-gradient(145deg,#fff8f5,#f2d8d9);text-align:center}.big{font:26px Georgia;color:var(--deep);font-weight:bold}.mini{font-size:12px;color:var(--muted);line-height:1.5}.k{font-size:10px;font-weight:900;color:var(--cherry);letter-spacing:.14em;text-transform:uppercase}.field{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:white;margin:6px 0 10px;font:inherit}.btn{width:100%;border:0;border-radius:16px;padding:13px;font-weight:800;background:var(--cherry);color:white}.ghost{background:white;color:var(--ink);border:1px solid var(--line);margin-top:10px}.stars{display:flex;gap:6px;margin:8px 0 12px}.star{border:0;background:white;border:1px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:19px}.star.on{background:#fff0d7}.memory{position:relative;padding-left:27px}.memory:before{content:'♥';position:absolute;left:0;top:16px;color:var(--cherry)}.memory:after{content:'';position:absolute;left:7px;top:40px;bottom:-15px;border-left:1px dashed #d9b9bc}.memory:last-child:after{display:none}.date{font-size:11px;color:var(--cherry);font-weight:800}.title{font:20px Georgia;color:var(--deep);font-weight:bold;margin:3px 0}.empty{text-align:center;padding:30px 10px}.past{border:1px dashed #d7a8aa;background:#fff9f7}.choice{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px;background:white;margin:8px 0}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}.stat b{display:block;font:20px Georgia;color:var(--deep)}.onthis{background:#fff7ea}.file{border:1px dashed #d7a8aa;padding:12px;border-radius:14px;background:#fff}</style></head><body><div class="app"><div class="brand">MATCHDAY</div><div class="tag">make time for us. ♡</div><h1>Matchbook ❤️</h1><div class="mini">Aquí viven sus Matches, fotos y pequeñas cosas que quieren volver a recordar.</div><div class="card hero"><div class="k">Our Story</div><div class="big" id="clock">Cargando su historia…</div><div class="mini" id="since"></div><div class="stats"><div class="stat"><b id="memCount">0</b><span class="mini">recuerdos</span></div><div class="stat"><b id="monthCount">0</b><span class="mini">este mes</span></div><div class="stat"><b id="completedCount">0</b><span class="mini">Matches</span></div></div></div><div id="onThisDay"></div><div id="pending"></div><div class="card"><div class="k">Save this Match ✨</div><select class="choice" id="matchSelect"><option value="">Un recuerdo libre</option></select><input class="field" id="title" placeholder="¿Cómo llamarían a este recuerdo?"><input class="field" id="date" type="date"><textarea class="field" id="note" rows="4" placeholder="¿Qué quieren recordar de este día?"></textarea><div class="mini">Foto opcional · solo la que ustedes elijan</div><input class="field file" id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><div class="mini">¿Cómo estuvo?</div><div class="stars" id="stars"></div><button class="btn" id="save">Guardar en Matchbook ❤️</button><div class="mini" id="msg" style="margin-top:9px"></div></div><div class="k" style="margin:24px 2px 8px">Su historia</div><div id="timeline"></div><button class="btn ghost" onclick="location.href='./'">← Volver a Inicio</button></div><script>const sb=supabase.createClient('https://eyyzeeqvaajkrpwquaui.supabase.co','sb_publishable_5g1TEdIr5-npVpU-0HY7Rw_GFk1TEFy'),$=id=>document.getElementById(id);let me,cid,matches=[],memories=[],rating=5,relationStart=null,clockTimer;for(let i=1;i<=5;i++)$('stars').insertAdjacentHTML('beforeend',`<button class="star ${i<=rating?'on':''}" data-v="${i}">★</button>`);$('stars').onclick=e=>{let b=e.target.closest('.star');if(!b)return;rating=+b.dataset.v;document.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',+x.dataset.v<=rating))};const today=()=>new Date().toLocaleDateString('en-CA'),esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function updateClock(){if(!relationStart)return;let start=new Date(relationStart+'T00:00:00'),now=new Date(),diff=Math.max(0,now-start),days=Math.floor(diff/86400000),hours=Math.floor(diff/3600000),minutes=Math.floor(diff/60000),months=(now.getFullYear()-start.getFullYear())*12+now.getMonth()-start.getMonth();if(now.getDate()<start.getDate())months--;months=Math.max(0,months);$('clock').textContent=`${months} ${months===1?'mes':'meses'} juntos · ${days} días ❤️`;$('since').textContent=`${hours.toLocaleString('es-MX')} horas · ${minutes.toLocaleString('es-MX')} minutos · desde ${start.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})}`;clearTimeout(clockTimer);clockTimer=setTimeout(updateClock,15000)}async function init(){let{data:{session}}=await sb.auth.getSession();if(!session)return location.href='./';me=session.user;let{data:m}=await sb.from('couple_members').select('couple_id').eq('user_id',me.id).maybeSingle();if(!m)return;cid=m.couple_id;let{data:members}=await sb.from('couple_members').select('user_id').eq('couple_id',cid),ids=(members||[]).map(x=>x.user_id),{data:profiles}=await sb.from('profiles').select('relationship_start').in('id',ids);relationStart=(profiles||[]).find(x=>x.relationship_start)?.relationship_start||null;$('date').value=today();updateClock();await load()}async function signed(path){if(!path)return null;let{data}=await sb.storage.from('matchday-memories').createSignedUrl(path,3600);return data?.signedUrl||null}async function load(){let[{data:mm},{data:mem}]=await Promise.all([sb.from('saved_matches').select('*').eq('couple_id',cid).order('match_date',{ascending:false}),sb.from('match_memories').select('*').eq('couple_id',cid).order('memory_date',{ascending:false}).order('created_at',{ascending:false})]);matches=mm||[];memories=mem||[];let remembered=new Set(memories.map(x=>x.match_id).filter(Boolean)),past=matches.filter(x=>x.status!=='cancelled'&&x.match_date<=today()&&!remembered.has(x.id));$('pending').innerHTML=past.length?`<div class="card past"><div class="k">Matches por recordar 🥹</div><div class="mini">${past.slice(0,4).map(x=>`${x.plan_emoji||'❤️'} <b>${esc(x.plan_title)}</b> · ${new Date(x.match_date+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'long'})}${x.challenge_key?' · 🎯':''}`).join('<br>')}</div></div>`:'';$('matchSelect').innerHTML='<option value="">Un recuerdo libre</option>'+past.map(x=>`<option value="${x.id}">${x.plan_emoji||'❤️'} ${esc(x.plan_title)} · ${x.match_date}</option>`).join('');let now=new Date(),ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;$('memCount').textContent=memories.length;$('monthCount').textContent=memories.filter(x=>x.memory_date.startsWith(ym)).length;$('completedCount').textContent=matches.filter(x=>x.status==='completed').length;let md=`-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,same=memories.filter(x=>x.memory_date.endsWith(md)&&!x.memory_date.startsWith(String(now.getFullYear())));$('onThisDay').innerHTML=same.length?`<div class="card onthis"><div class="k">UN DÍA COMO HOY… ✨</div><div class="title">${esc(same[0].title)}</div><div class="mini">${new Date(same[0].memory_date+'T12:00:00').toLocaleDateString('es-MX',{year:'numeric',day:'numeric',month:'long'})}${same[0].note?' · '+esc(same[0].note):''}</div></div>`:'';let urls={};await Promise.all(memories.filter(x=>x.photo_path).map(async x=>urls[x.id]=await signed(x.photo_path)));$('timeline').innerHTML=memories.length?memories.map(x=>`<div class="card memory"><div class="date">${new Date(x.memory_date+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="title">${esc(x.title)}</div><div>${'★'.repeat(x.rating||0)}${'☆'.repeat(5-(x.rating||0))}</div>${urls[x.id]?`<img class="photo" src="${urls[x.id]}" alt="Recuerdo">`:''}${x.note?`<div class="mini" style="margin-top:8px">${esc(x.note)}</div>`:''}</div>`).join(''):'<div class="card empty"><div style="font-size:45px">📖❤️</div><div class="title">Su historia empieza aquí</div><div class="mini">Guarden una cita o un recuerdo y aparecerá aquí.</div></div>'}$('matchSelect').onchange=()=>{let x=matches.find(m=>m.id===$('matchSelect').value);if(x){$('title').value=x.plan_title;$('date').value=x.match_date}};$('save').onclick=saveMemory}async function saveMemory(){let title=$('title').value.trim(),date=$('date').value,file=$('photo').files[0];if(!title||!date)return $('msg').textContent='Ponle nombre y fecha al recuerdo ♡';$('save').disabled=true;$('msg').textContent='Guardando…';let mid=$('matchSelect').value||null,{data:memory,error}=await sb.from('match_memories').insert({couple_id:cid,match_id:mid,created_by:me.id,memory_date:date,title,note:$('note').value.trim()||null,rating}).select('id').single();if(error){$('msg').textContent=error.message;$('save').disabled=false;return}if(file){if(file.size>5*1024*1024){$('msg').textContent='El recuerdo se guardó, pero la foto supera 5 MB.'}else{let ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${cid}/${memory.id}/${Date.now()}.${ext}`,up=await sb.storage.from('matchday-memories').upload(path,file,{upsert:false});if(up.error)$('msg').textContent='El recuerdo se guardó, pero la foto no subió: '+up.error.message;else await sb.from('match_memories').update({photo_path:path}).eq('id',memory.id).eq('couple_id',cid)}}if(mid){let match=matches.find(x=>x.id===mid);await sb.from('saved_matches').update({status:'completed'}).eq('id',mid).eq('couple_id',cid);if(match?.challenge_key&&match?.challenge_item_key){await sb.from('challenge_steps').update({done:true,done_at:new Date().toISOString()}).eq('couple_id',cid).eq('step_key',match.challenge_item_key).eq('match_id',mid)}}$('title').value='';$('note').value='';$('photo').value='';$('matchSelect').value='';$('msg').textContent='Guardado en su Matchbook ❤️';$('save').disabled=false;await load()}init();</script></body></html>
