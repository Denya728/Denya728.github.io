<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf7f4"><title>Recaditos · MATCHDAY</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#fbf7f4;--card:#fffdfa;--ink:#302426;--muted:#8c7478;--rose:#efd0d1;--cherry:#a94652;--deep:#7e303c;--line:#eadfdd;--cream:#f6eee8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(#fbf8f6,#f5eceb);color:var(--ink)}.app{max-width:480px;min-height:100vh;margin:auto;padding:18px 17px 40px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{border:1px solid var(--line);background:white;border-radius:14px;padding:10px 13px;color:var(--deep);font-weight:800}.brand{font:900 20px Georgia;color:var(--cherry);letter-spacing:.08em}.tag,.mini{font-size:12px;color:var(--muted);line-height:1.45}h1{font:30px Georgia;color:var(--deep);margin:9px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:23px;padding:15px;margin:10px 0;box-shadow:0 8px 24px rgba(85,50,54,.04)}.mine{background:linear-gradient(145deg,#fff8f5,#f4dddd);margin-left:30px}.theirs{margin-right:30px}.who{font-weight:900;color:var(--cherry);font-size:12px}.body{font-size:15px;line-height:1.5;margin:7px 0;white-space:pre-wrap}.time{font-size:11px;color:var(--muted)}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.heart{font-size:42px}.live{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 9px;border-radius:999px;background:var(--cream);font-size:11px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:#8fcf70}</style></head><body><main class="app"><div class="top"><button class="back" onclick="location.href='index.html'">‹ Inicio</button><div><div class="brand">MATCHDAY</div><div class="tag">make time for us. ♡</div></div></div><div class="mini">RECADITOS 💌</div><h1>Nuestra bandejita</h1><div class="mini">Aquí se guardan sus recaditos, del más nuevo al más antiguo.</div><div class="live"><span class="dot"></span>Actualización en vivo</div><div id="list"><div class="empty">Cargando recaditos…</div></div></main><script>const sb=supabase.createClient('https://eyyzeeqvaajkrpwquaui.supabase.co','sb_publishable_5g1TEdIr5-npVpU-0HY7Rw_GFk1TEFy'),list=document.getElementById('list');let channel=null,cid=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=x=>new Date(x).toLocaleString('es-MX',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});async function load(){let{data:{session}}=await sb.auth.getSession();if(!session)return location.href='index.html';let me=session.user.id,{data:m}=await sb.from('couple_members').select('couple_id').eq('user_id',me).maybeSingle();if(!m){list.innerHTML='<div class="empty">Primero vinculen su pareja ❤️</div>';return}cid=m.couple_id;let{data:members}=await sb.from('couple_members').select('user_id').eq('couple_id',cid),ids=(members||[]).map(x=>x.user_id),{data:profiles}=await sb.from('profiles').select('id,name').in('id',ids),names=Object.fromEntries((profiles||[]).map(x=>[x.id,x.name]));let{data:notes,error}=await sb.from('notes').select('id,body,created_at,author_id').eq('couple_id',cid).order('created_at',{ascending:false}).limit(200);if(error){list.innerHTML='<div class="empty">No pude cargar los recaditos.</div>';return}if(!notes?.length){list.innerHTML='<div class="empty"><div class="heart">💌</div>Aún no tienen recaditos guardados.</div>';setupLive();return}list.innerHTML=notes.map(n=>`<article class="card ${n.author_id===me?'mine':'theirs'}"><div class="who">${esc(n.author_id===me?'Tú':names[n.author_id]||'Tu persona')}</div><div class="body">${esc(n.body)}</div><div class="time">${stamp(n.created_at)}</div></article>`).join('');setupLive()}function setupLive(){if(channel||!cid)return;channel=sb.channel('matchday-recaditos-live').on('postgres_changes',{event:'*',schema:'public',table:'notes',filter:`couple_id=eq.${cid}`},()=>load()).subscribe()}document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});load();</script></body></html>
