<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf7f4"><title>Recaditos · MATCHDAY</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--card:#fffdfa;--ink:#302426;--muted:#8c7478;--rose:#efd0d1;--cherry:#a94652;--deep:#7e303c;--line:#eadfdd;--cream:#f6eee8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(#fbf8f6,#f5eceb);color:var(--ink)}button,textarea{font:inherit}.app{max-width:480px;min-height:100vh;margin:auto;padding:16px 14px 130px}.top{display:flex;align-items:center;gap:12px;position:sticky;top:0;padding:4px 0 12px;background:rgba(251,247,244,.96);backdrop-filter:blur(10px);z-index:5}.back{border:1px solid var(--line);background:white;border-radius:14px;padding:10px 13px;color:var(--deep);font-weight:800}.brand{font:900 20px Georgia;color:var(--cherry);letter-spacing:.08em}.mini,.time{font-size:11px;color:var(--muted);line-height:1.4}h1{font:29px Georgia;color:var(--deep);margin:10px 2px 2px}.status{display:flex;justify-content:space-between;align-items:center;margin:7px 2px 18px}.live{display:inline-flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#8fcf70}.day{text-align:center;font-size:11px;color:var(--muted);margin:18px 0 8px}.bubble{max-width:86%;border:1px solid var(--line);border-radius:20px;padding:11px 13px;margin:7px 0;background:white;box-shadow:0 5px 16px rgba(85,50,54,.035)}.mine{margin-left:auto;background:linear-gradient(145deg,#fff5f3,#f3d8da);border-bottom-right-radius:6px}.theirs{margin-right:auto;border-bottom-left-radius:6px}.who{font-size:10px;font-weight:900;color:var(--cherry)}.body{font-size:15px;line-height:1.45;margin:4px 0 5px;white-space:pre-wrap;word-break:break-word}.meta{display:flex;gap:7px;align-items:center;justify-content:flex-end}.read{font-size:10px;color:var(--cherry);font-weight:800}.replyQuote{border-left:3px solid #d7a8aa;background:rgba(255,255,255,.55);border-radius:7px;padding:6px 8px;margin-bottom:6px;font-size:11px;color:var(--muted)}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.react,.replyBtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-size:12px}.react.mineReact{background:var(--rose)}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);padding:9px 14px max(12px,env(safe-area-inset-bottom));background:rgba(255,253,250,.98);border-top:1px solid var(--line);z-index:10}.replying{display:none;background:var(--cream);border-radius:12px;padding:7px 10px;margin-bottom:6px;font-size:11px;color:var(--muted)}.replying.on{display:flex;justify-content:space-between}.write{display:flex;gap:7px;align-items:flex-end}.write textarea{resize:none;min-height:44px;max-height:100px;flex:1;border:1px solid var(--line);border-radius:17px;padding:11px;background:white}.send{border:0;border-radius:16px;background:var(--cherry);color:white;font-weight:900;padding:13px 14px}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.heart{font-size:42px}.count{background:var(--cherry);color:white;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900}</style></head><body><main class="app"><div class="top"><button class="back" onclick="location.href='index.html'">‹ Inicio</button><div><div class="brand">MATCHDAY</div><div class="mini">make time for us. ♡</div></div></div><h1>Recaditos 💌</h1><div class="status"><span class="live mini"><span class="dot"></span>En vivo</span><span id="unread" class="count" style="display:none"></span></div><div id="list"><div class="empty">Cargando…</div></div></main><div class="composer"><div id="replying" class="replying"><span id="replyText"></span><button style="border:0;background:none" onclick="cancelReply()">×</button></div><div class="write"><textarea id="body" placeholder="Escribe un recadito…"></textarea><button id="send" class="send">💌</button></div></div><script>const sb=supabase.createClient('https://eyyzeeqvaajkrpwquaui.supabase.co','sb_publishable_5g1TEdIr5-npVpU-0HY7Rw_GFk1TEFy'),$=x=>document.getElementById(x);let me,cid,names={},channel,replyTo=null,loading=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clock=x=>new Date(x).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'}),dayKey=x=>new Date(x).toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'});async function boot(){let{data:{session}}=await sb.auth.getSession();if(!session)return location.href='index.html';me=session.user.id;let{data:m}=await sb.from('couple_members').select('couple_id').eq('user_id',me).maybeSingle();if(!m)return $('list').innerHTML='<div class="empty">Primero vinculen su pareja ❤️</div>';cid=m.couple_id;let{data:members}=await sb.from('couple_members').select('user_id').eq('couple_id',cid),ids=(members||[]).map(x=>x.user_id),{data:p}=await sb.from('profiles').select('id,name').in('id',ids);names=Object.fromEntries((p||[]).map(x=>[x.id,x.name]));await load();setupLive()}async function load(){if(loading)return;loading=true;let{data:notes,error}=await sb.from('notes').select('id,body,created_at,author_id,read_at,reply_to_id').eq('couple_id',cid).order('created_at',{ascending:true}).limit(300);if(error){$('list').innerHTML='<div class="empty">No pude cargar los recaditos.</div>';loading=false;return}let{data:reactions}=await sb.from('note_reactions').select('*').eq('couple_id',cid);let unread=(notes||[]).filter(n=>n.author_id!==me&&!n.read_at),u=$('unread');u.style.display=unread.length?'inline':'none';u.textContent=unread.length?`${unread.length} nuevo${unread.length===1?'':'s'}`:'';if(unread.length)await sb.from('notes').update({read_at:new Date().toISOString()}).in('id',unread.map(n=>n.id));if(!notes?.length){$('list').innerHTML='<div class="empty"><div class="heart">💌</div>Aquí aparecerá su primer recadito.</div>';loading=false;return}let byId=Object.fromEntries(notes.map(n=>[n.id,n])),lastDay='';$('list').innerHTML=notes.map(n=>{let d=dayKey(n.created_at),sep=d!==lastDay?`<div class="day">${d}</div>`:'';lastDay=d;let rs=(reactions||[]).filter(r=>r.note_id===n.id),reactionButtons=['❤️','😂','🥺','😘'].map(e=>{let mine=rs.find(r=>r.user_id===me&&r.emoji===e),count=rs.filter(r=>r.emoji===e).length;return `<button class="react ${mine?'mineReact':''}" onclick="react('${n.id}','${e}')">${e}${count?` ${count}`:''}</button>`}).join(''),q=n.reply_to_id&&byId[n.reply_to_id]?`<div class="replyQuote">↩ ${esc(byId[n.reply_to_id].body.slice(0,80))}</div>`:'';return `${sep}<article class="bubble ${n.author_id===me?'mine':'theirs'}">${q}<div class="who">${esc(n.author_id===me?'Tú':names[n.author_id]||'Tu persona')}</div><div class="body">${esc(n.body)}</div><div class="meta"><span class="time">${clock(n.created_at)}</span>${n.author_id===me?`<span class="read">${n.read_at?'Leído ✓✓':'Enviado ✓'}</span>`:''}</div><div class="actions">${reactionButtons}<button class="replyBtn" onclick="reply('${n.id}')">↩ Responder</button></div></article>`}).join('');loading=false;setTimeout(()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),40)}window.reply=id=>{replyTo=id;$('replyText').textContent='↩ Respondiendo a este recadito';$('replying').classList.add('on');$('body').focus()};window.cancelReply=()=>{replyTo=null;$('replying').classList.remove('on')};window.react=async(id,emoji)=>{let{data:old}=await sb.from('note_reactions').select('id,emoji').eq('note_id',id).eq('user_id',me).maybeSingle();if(old?.emoji===emoji)await sb.from('note_reactions').delete().eq('id',old.id);else if(old)await sb.from('note_reactions').update({emoji}).eq('id',old.id);else await sb.from('note_reactions').insert({couple_id:cid,note_id:id,user_id:me,emoji});load()};$('send').onclick=async()=>{let body=$('body').value.trim();if(!body)return;let row={couple_id:cid,author_id:me,body};if(replyTo)row.reply_to_id=replyTo;let{error}=await sb.from('notes').insert(row);if(!error){$('body').value='';cancelReply();load()}};function setupLive(){if(channel)return;channel=sb.channel('recaditos-v2-'+cid).on('postgres_changes',{event:'*',schema:'public',table:'notes',filter:`couple_id=eq.${cid}`},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'note_reactions',filter:`couple_id=eq.${cid}`},()=>load()).subscribe()}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cid)load()});boot();</script></body></html>
